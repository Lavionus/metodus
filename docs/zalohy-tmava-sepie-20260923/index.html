<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Metodus | Interaktivní učení</title>
  <meta name="description" content="Metodus – interaktivní výukové aplikace pro 1. a 2. stupeň ZŠ i střední školu. Čeština, matematika, přírodní vědy, zeměpis, dějepis a cizí jazyky. Zdarma a bez registrace. Uložené lekce lze používat offline; živá data vyžadují internet." />
  <link rel="stylesheet" href="common.css" />
  <script src="theme.js"></script>
  <script src="podpis.js" defer></script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#2d2d2d" />
  <style>
    body {
      height: 100vh;
      overflow: hidden;
    }

    /* Značka v hlavičce. Cesta je vložená přímo (ne <img> ani CSS maska
       nad logo.svg) – barvu tak bere z motivu přes currentColor a vykreslí
       se i přes file:// a bez ohledu na stav cache service workeru. */
    .znacka-symbol {
      width: 1.3em;
      height: 0.97em;
      vertical-align: -0.1em;
      fill: var(--accent);
    }

    /* Layout */
    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Hlavička */
    .hlavicka {
      background-color: var(--bg-elevated);
      color: var(--text);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hlavicka-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .hlavicka h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Hamburger – jen na malých obrazovkách */
    .hamburger {
      display: none;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .hamburger:hover {
      background-color: var(--accent);
      color: var(--na-akcentu, #fff);
      border-color: var(--accent);
    }

    /* Tmavé pozadí pod vysunutým menu */
    .menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    /* Hlavní obsah */
    .obsah {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Menu */
    .menu {
      width: 240px;
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) var(--bg-panel);
    }

    /* Lepkavá horní lišta menu: hledání + filtrovací pilulky */
    .menu-top {
      position: sticky;
      top: 0;
      z-index: 5;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border);
    }

    .menu-search-wrap {
      padding: 10px 10px 6px 10px;
    }

    .menu-search {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.85rem;
    }

    .menu-search:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    /* Panel filtrů (předmět + ročník + připravované) */
    .filtry {
      padding: 2px 10px 10px 10px;
    }

    .filtr-nadpis {
      color: var(--text-faint);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 8px 0 5px 2px;
    }

    /* Předmět: tlačítko s rozbalovací nabídkou – devět pilulek vedle sebe
       ukrajovalo třetinu menu, ročníky se vejdou na dva řádky a zůstávají vidět */
    .predmet-drop {
      position: relative;
    }

    .skupiny-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      text-align: left;
      padding: 7px 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .skupiny-toggle:hover {
      background-color: var(--bg-hover);
    }

    .skupiny-toggle:focus-visible {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .skupiny-toggle .sipka {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-faint);
      transition: transform 0.2s ease;
    }

    .skupiny-toggle[aria-expanded="true"] .sipka {
      transform: rotate(180deg);
    }

    .skupiny {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 20;
      flex-direction: column;
      gap: 2px;
      padding: 5px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      max-height: 60vh;
      overflow-y: auto;
    }

    .skupiny.show {
      display: flex;
    }

    /* Ročníky: úzké pilulky v mřížce, ať se vejdou na jeden až dva řádky */
    .rocniky {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }

    .rocnik-pill {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 5px 0;
      font-size: 0.78rem;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .rocnik-pill:hover:not(:disabled) {
      background-color: var(--bg-hover);
      color: var(--text);
    }

    .rocnik-pill.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--na-akcentu, #fff);
      font-weight: 600;
    }

    .rocnik-pill:disabled {
      opacity: 0.35;
      cursor: default;
    }

    /* Přepínač zobrazení připravovaných stránek */
    .prepinac {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--text-muted);
      font-size: 0.78rem;
      cursor: pointer;
      user-select: none;
    }

    .prepinac input { cursor: pointer; }
    .prepinac[hidden] { display: none; }

    .skupina-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      background: none;
      border: 1px solid transparent;
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.8rem;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .skupina-pill:hover {
      background-color: var(--bg-hover);
      color: var(--text);
    }

    .skupina-pill.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--na-akcentu, #fff);
      font-weight: 600;
    }

    .skupina-pill .pill-pocet {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-faint);
      background-color: var(--bg-input);
      border-radius: 9px;
      padding: 0 6px;
      line-height: 1.4;
    }

    .skupina-pill:hover .pill-pocet,
    .skupina-pill.active .pill-pocet {
      color: #fff;
      background-color: rgba(0, 0, 0, 0.25);
    }

    /* Hláška, když hledání nic nenajde */
    .bez-vysledku {
      display: none;
      padding: 18px 16px;
      color: var(--text-faint);
      font-size: 0.85rem;
      text-align: center;
    }
    .bez-vysledku.zobraz { display: block; }

    .sekce {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .sekce:last-child {
      border-bottom: none;
    }

    .sekce h2 {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 10px 15px 8px 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      border-radius: 4px;
      padding: 4px 6px;
      transition: background-color 0.15s ease;
    }

    .sekce h2:hover {
      background-color: var(--bg-elevated);
      color: var(--accent-hover);
    }

    .sekce h2 .pocet {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-faint);
      background-color: var(--bg-hover);
      border-radius: 10px;
      padding: 1px 7px;
      font-weight: 600;
    }

    .sekce h2 .sipka {
      font-size: 0.7rem;
      color: var(--text-faint);
      transition: transform 0.2s ease;
    }

    .sekce.collapsed h2 .sipka {
      transform: rotate(-90deg);
    }

    .sekce.collapsed ul {
      display: none;
    }

    .sekce ul {
      list-style: none;
    }

    /* Sekce s jedinou aplikací: hlavička by jen zdvojovala název položky,
       proto se zobrazí rovnou odkaz a sekce se nedá sbalit. */
    .sekce.jedina {
      padding: 4px 0;
    }

    .sekce.jedina h2 {
      display: none;
    }

    .sekce.jedina ul {
      display: block;
    }

    .sekce li {
      position: relative;
    }

    .sekce a {
      display: block;
      padding: 8px 32px 8px 25px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      border-left: 3px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sekce a:hover,
    .sekce a.kb-focus {
      background-color: var(--bg-hover);
      color: var(--text);
      padding-left: 30px;
    }

    /* Připravovaná stránka – v menu vizuálně odlišená */
    .sekce a.plan {
      color: var(--text-faint);
    }

    .sekce a.plan .znak-plan {
      font-size: 0.72rem;
      opacity: 0.85;
      margin-left: 5px;
    }

    .sekce a.active {
      background-color: var(--bg-control);
      border-left-color: var(--accent);
      color: var(--accent);
      font-weight: 500;
    }

    /* Hvězdička oblíbených */
    .hvezda {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-faint);
      opacity: 0;
      padding: 2px 4px;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .sekce li:hover .hvezda { opacity: 0.7; }
    .hvezda:hover { opacity: 1 !important; color: var(--warn); }
    .hvezda.je-oblibena { opacity: 0.9; color: var(--warn); }

    /* Ovládání v hlavičce */
    .ovladani {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ovladani button {
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .ovladani button:hover {
      background-color: var(--accent);
      color: var(--na-akcentu, #fff);
      border-color: var(--accent);
    }

    /* V hlavičce stačí ikona, v nabídce „Další" je potřeba i slovo. */
    .ovladani button .popis { display: none; }

    /* Výklopný seznam motivů (nativní <select>: klávesnice, dotyk i čtečky ho znají) */
    .tema-volba { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); }
    .tema-volba select {
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tema-volba select:hover { border-color: var(--accent); color: var(--text); }
    .tema-volba select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .ovladani .tema-volba .popis { display: none; }

    /* Nabídka „Další" – na úzké obrazovce sdružuje akce, které se do hlavičky nevejdou */
    .vice-obal { position: relative; flex-shrink: 0; }
    .vice-toggle {
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .vice-toggle:hover, .vice-toggle[aria-expanded="true"] {
      background-color: var(--accent);
      color: var(--na-akcentu, #fff);
      border-color: var(--accent);
    }
    .vice-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 1001;
      min-width: 220px;
      /* zavřenou nabídku drží atribut hidden — display musí platit až pro otevřenou */
      display: none;
      flex-direction: column;
      gap: 4px;
      padding: 6px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }
    .vice-menu:not([hidden]) { display: flex; }
    .vice-menu button {
      /* v nabídce už neplatí .ovladani button – bez vlastních barev by zůstalo šedé systémové tlačítko */
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      font-size: 0.9rem;
      padding: 10px 12px;
    }
    .vice-menu button:hover { background-color: var(--accent); color: var(--na-akcentu, #fff); border-color: var(--accent); }
    .vice-menu button .popis { display: inline; }
    .vice-menu button .ikona { width: 1.4em; text-align: center; }
    .vice-menu .tema-volba { justify-content: space-between; padding: 6px 12px; font-size: 0.9rem; }
    .vice-menu .tema-volba select { font-size: 0.9rem; padding: 8px 10px; min-height: 38px; }

    /* Zrušení filtrů – viditelné jen tehdy, když je co rušit */
    .zrusit-filtry {
      margin-top: 10px;
      width: 100%;
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .zrusit-filtry:hover { background-color: var(--accent); color: var(--na-akcentu, #fff); border-color: var(--accent); }
    .zrusit-co { display: block; font-size: 0.72rem; opacity: 0.85; margin-top: 2px; }

    /* zvýraznění při hledání */
    .sekce a.zvyrazneno {
      background-color: var(--accent-soft);
      color: var(--text);
    }

    .sekce.skryto { display: none; }
    .sekce li.skryto { display: none; }

    @media (max-width: 768px) {
      .ovladani .jen-desktop { display: none; }
    }

    /* Úzká hlavička: jeden řádek — menu, název, úvod a nabídka Další.
       Ostatní akce do ní přesune presunOvladani(). */
    @media (max-width: 700px) {
      .hlavicka { padding: 10px 12px; gap: 10px; }
      .hlavicka-left { gap: 8px; flex: 1 1 auto; }
      .hlavicka h1 { font-size: 1.05rem; }
      .ovladani { flex-wrap: nowrap; }
      /* stejně vysoké a prstem trefitelné prvky v jednom řádku */
      .hlavicka button { min-height: 38px; }
      .vice-menu { max-height: 70vh; overflow-y: auto; }
    }

    /* Pracovní plocha */
    .pracovni-plocha {
      flex: 1;
      background-color: var(--bg-deep);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pracovni-plocha iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Responzivita – telefon a tablet: menu skryté v hamburgeru */
    @media (max-width: 1024px) {
      .hamburger { display: inline-flex; }

      .menu {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 80%;
        max-width: 300px;
        z-index: 1000;
        border-right: 1px solid var(--border);
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: 2px 0 14px rgba(0, 0, 0, 0.55);
      }
      .menu.open { transform: translateX(0); }

      .menu-overlay { display: block; }
      .menu-overlay.show { opacity: 1; pointer-events: auto; }

      .pracovni-plocha { width: 100%; }
    }

    .hamburger:focus-visible,
    .ovladani button:focus-visible,
    .vice-toggle:focus-visible,
    .vice-menu button:focus-visible,
    .zrusit-filtry:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .ovladani button.aktivni {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--na-akcentu, #fff);
    }

    /* ---- Režim projektor (viz projektor.js) ----
       Zapnutý režim schová menu i hlavičku a nechá na obrazovce jen
       plovoucí lištu; obsah se zvětšuje škálováním rámu. Lišta má
       velké terče, protože se na ni klepe prstem na tabuli. */
    body.projektor .menu,
    body.projektor .hlavicka,
    body.projektor .menu-overlay { display: none; }

    body.projektor .pracovni-plocha { background-color: #000; }

    .projektor-lista {
      display: none;
      position: fixed;
      right: 14px;
      bottom: calc(14px + var(--podpis-vyska, 0px));
      z-index: 1200;
      gap: 6px;
      align-items: center;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 6px 8px;
      box-shadow: var(--shadow);
      opacity: 0.35;
      transition: opacity 0.2s ease;
    }

    /* Lišta nesmí přebíjet obraz – rozsvítí se, až když o ni učitel stojí. */
    .projektor-lista:hover,
    .projektor-lista:focus-within { opacity: 1; }

    body.projektor .projektor-lista { display: flex; }

    .projektor-lista button {
      background-color: var(--bg-control);
      border: 1px solid var(--border-strong);
      color: var(--text);
      border-radius: 999px;
      min-width: 42px;
      height: 42px;
      padding: 0 12px;
      font-size: 1.05rem;
      line-height: 1;
      cursor: pointer;
    }

    .projektor-lista button:hover {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--na-akcentu, #fff);
    }


    /* Menu vyvolané z lišty leží nad obrazem, aby se dala vybrat další
       aplikace bez opuštění režimu. */
    body.projektor.menu-nad .menu {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: min(85%, 340px);
      z-index: 1300;
      box-shadow: 2px 0 14px rgba(0, 0, 0, 0.55);
    }

    body.projektor.menu-nad .menu-overlay {
      display: block;
      opacity: 1;
      pointer-events: auto;
      z-index: 1250;
    }

    .projektor-lista .uroven {
      font-size: 0.9rem;
      color: var(--text-muted);
      min-width: 52px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="hlavicka">
      <div class="hlavicka-left">
        <button id="hamburger" class="hamburger" aria-label="Otevřít menu" aria-expanded="false" aria-controls="hlavniMenu">☰</button>
        <h1><svg class="znacka-symbol" viewBox="0 0 655 488" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,488) scale(0.1,-0.1)"><path d="M5911 4824 c-708 -239 -1389 -584 -1876 -950 -352 -264 -547 -485 -738 -835 -22 -40 -20 -42 -92 91 -182 335 -566 695 -1067 999 -428 259 -1117 569 -1582 710 -225 69 -459 -49 -526 -266 -33 -109 -31 -4397 3 -4463 39 -78 132 -121 215 -100 247 62 474 296 558 575 17 56 18 153 21 1635 1 866 2 1588 3 1604 0 40 33 34 285 -50 976 -324 1596 -753 1810 -1254 117 -274 117 -276 124 -1170 7 -837 2 -784 71 -843 111 -95 297 -66 363 56 22 42 22 42 28 817 5 741 6 779 26 865 124 529 489 910 1200 1252 354 169 962 387 984 351 5 -7 9 -727 9 -1599 0 -1587 0 -1587 25 -1673 45 -155 115 -267 238 -382 223 -208 448 -238 531 -72 26 52 26 52 26 2204 0 1529 -3 2168 -11 2206 -41 199 -219 348 -413 348 -35 0 -102 -17 -215 -56z"/></g></svg> Metodus</h1>
      </div>

      <nav class="menu" id="hlavniMenu">
        <div class="menu-top">
          <div class="menu-search-wrap">

              <button class="skupiny-toggle" id="skupinyToggle" aria-haspopup="true" aria-expanded="false" aria-controls="skupiny">
                <span id="skupinyToggleLabel">📚 Vše</span>

        <iframe name="okno" src="obsah/prehled.html" title="Aktivní aplikace" allowfullscreen></iframe>

      <button id="projMensi" title="Zmenšit obraz">−</button>
      <span class="uroven" id="projUroven">150 %</span>
      <button id="projVetsi" title="Zvětšit obraz">+</button>
      <button id="projMenu" title="Vybrat jinou aplikaci">☰</button>
      <button id="projFull" title="Celá obrazovka">⛶</button>

  </div>

  <script src="apps.js"></script>
  <script src="projektor.js"></script>
  <script>
    /* ============================================================
       Metodus: menu se generuje z katalogu v apps.js.
       Stav: hash v URL (deep-link), localStorage (téma, oblíbené,
       nedávné, sbalené sekce, skupina), sessionStorage (poslední
       otevřená stránka).
       ============================================================ */
    /* Zápis do úložiště: přes file:// (a v přísném režimu soukromí) je kvóta
       nulová a setItem vyhodí výjimku — nesmí shodit zbytek skriptu, web pak
       funguje dál, jen si nic nezapamatuje. */
    function uloz(uloziste, klic, hodnota) {
      try { uloziste.setItem(klic, hodnota); }
      catch { /* bez trvalé paměti */ }
    }

    function precti(uloziste, klic) {
      try { return uloziste.getItem(klic); }
      catch { return null; }
    }

    if (location.protocol === 'file:') {
      console.warn('Web je otevřený přes file:// — nastavení se neuloží a část '
        + 'aplikací nenačte data. Spusť ./test_local.sh a otevři http://localhost:8000/');
    }

    const DOMOVSKA = 'obsah/prehled.html';
    // stránky, které nejsou aplikacemi v katalogu, ale smí se otevřít v ploše
    // (na vyslovnost.html pořád přesměrovává staré odkazy hlavní web)
    const STRANKY_MIMO_KATALOG = [DOMOVSKA, 'obsah/osnova.html', 'obsah/predstaveni.html',
      'obsah/vyslovnost.html'];
    const KEY_PAGE = 'metodus_current_page';
    const KEY_COLLAPSE = 'metodus_collapsed_sections';
    const KEY_SKUPINA = 'metodus_skupina';
    const KEY_OBLIBENE = 'metodus_oblibene';
    const KEY_NEDAVNE = 'metodus_nedavne';
    const KEY_ROCNIK = 'metodus_rocnik';
    const KEY_PLAN = 'metodus_zobraz_plan';
    const KEY_TEMA = 'webapp_theme';

    const iframe = document.querySelector('iframe[name="okno"]');
    const menuEl = document.getElementById('hlavniMenu');
    const menuSekceEl = document.getElementById('menuSekce');
    const skupinyEl = document.getElementById('skupiny');
    const rocnikyEl = document.getElementById('rocniky');
    const prepinacPlan = document.getElementById('prepinacPlan');
    const skupinyToggle = document.getElementById('skupinyToggle');
    const skupinyToggleLabel = document.getElementById('skupinyToggleLabel');
    const bezVysledku = document.getElementById('bezVysledku');

    // Nabídka předmětů je rozbalovací a po volbě se zase zavře; stav se
    // nepamatuje, aby menu po každém načtení začínalo u seznamu učiva.
    function setSkupinyOpen(open) {
      skupinyEl.classList.toggle('show', open);
      skupinyToggle.setAttribute('aria-expanded', String(open));
    }
    skupinyToggle.addEventListener('click', e => {
      e.stopPropagation();
      setSkupinyOpen(!skupinyEl.classList.contains('show'));
    });
    // klik mimo nabídku ji zavře (klik uvnitř řeší vyberSkupinu)
    document.addEventListener('click', e => {
      if (!e.target.closest('.predmet-drop')) setSkupinyOpen(false);
    });

    const nactiJson = (key, def) => {
      try { return JSON.parse(precti(localStorage, key)) ?? def; }
      catch { return def; }
    };

    // Při první návštěvě (žádné uložené preference) start se všemi sekcemi
    // sbalenými — jinak by uvítal dlouhý sloupec stovek rozbalených položek.
    let collapsedSet = precti(localStorage, KEY_COLLAPSE) === null
      ? new Set(KATALOG_SEKCE.map(s => s.nazev))
      : new Set(nactiJson(KEY_COLLAPSE, []));
    let aktivniSkupina = precti(localStorage, KEY_SKUPINA) || 'vse';
    let aktivniRocnik = precti(localStorage, KEY_ROCNIK) || 'vse';
    // připravované stránky (🚧) jsou ve výchozím stavu vidět – jsou to úkoly osnovy
    let zobrazPlan = precti(localStorage, KEY_PLAN) !== '0';
    let oblibene = nactiJson(KEY_OBLIBENE, []);
    let nedavne = nactiJson(KEY_NEDAVNE, []);

    // index katalogu: soubor -> {nazev, tagy, predmet, rocniky, stav}
    const podleSouboru = new Map();
    const VSECHNY = [];
    KATALOG_SEKCE.forEach(s => s.polozky.forEach(p => {
      podleSouboru.set(p.soubor, p);
      VSECHNY.push({ ...p, skupina: s.skupina });
    }));

    // hledání bez diakritiky
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    /* ---- Stavba menu z katalogu ---- */
    function vytvorPolozku(p) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + p.soubor;               // klik = změna hashe -> hashchange otevře aplikaci
      a.dataset.page = p.soubor;
      a.textContent = p.nazev;
      a.dataset.hledani = norm(p.nazev + ' ' + (p.tagy || []).join(' '));
      a.dataset.rocniky = (p.rocniky || []).join(',');
      if (p.stav === 'plan') {
        a.classList.add('plan');
        a.dataset.plan = '1';
        a.title = 'Připravujeme – stránka zatím jen popisuje, co má aplikace umět';
        const znak = document.createElement('span');
        znak.className = 'znak-plan';
        znak.textContent = '🚧';
        a.appendChild(znak);
      }
      const st = document.createElement('button');
      st.className = 'hvezda';
      st.title = 'Přidat / odebrat z oblíbených';
      st.textContent = '★';
      st.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        toggleOblibena(p.soubor);
      });
      li.appendChild(a);
      li.appendChild(st);
      return li;
    }

    function vytvorSekci(nazev, skupina, polozky, special) {
      const div = document.createElement('div');
      div.className = 'sekce';
      div.dataset.nazev = nazev;
      div.dataset.skupina = skupina;
      if (special) div.dataset.special = '1';
      const h2 = document.createElement('h2');
      const span = document.createElement('span');
      span.textContent = nazev;
      const badge = document.createElement('span');
      badge.className = 'pocet';
      badge.textContent = polozky.length;
      const sipka = document.createElement('span');
      sipka.className = 'sipka';
      sipka.textContent = '▾';
      h2.append(span, badge, sipka);
      const ul = document.createElement('ul');
      polozky.forEach(p => ul.appendChild(vytvorPolozku(p)));
      div.append(h2, ul);
      if (polozky.length === 1 && !special) div.classList.add('jedina');
      else if (collapsedSet.has(nazev)) div.classList.add('collapsed');
      h2.addEventListener('click', () => {
        setCollapsed(div, !div.classList.contains('collapsed'));
        saveCollapsed();
      });
      return div;
    }

    function renderMenu() {
      menuSekceEl.innerHTML = '';
      // speciální sekce nahoře
      const obl = oblibene.map(f => podleSouboru.get(f)).filter(Boolean);
      if (obl.length) menuSekceEl.appendChild(vytvorSekci('⭐ Oblíbené', 'vse', obl, true));
      // katalogové sekce
      KATALOG_SEKCE.forEach(s => menuSekceEl.appendChild(vytvorSekci(s.nazev, s.skupina, s.polozky, false)));
      obnovHvezdy();
      updateActiveLink(aktualni);
      aplikujFiltr();
    }

    /* ---- Sbalování sekcí ---- */
    function saveCollapsed() {
      uloz(localStorage, KEY_COLLAPSE, JSON.stringify([...collapsedSet]));
    }
    function setCollapsed(s, collapsed) {
      if (s.classList.contains('jedina')) return;   // jednopoložkovou sekci není co sbalovat
      s.classList.toggle('collapsed', collapsed);
      if (collapsed) collapsedSet.add(s.dataset.nazev);
      else collapsedSet.delete(s.dataset.nazev);
    }
    const vsechnySekce = () => [...menuSekceEl.querySelectorAll('.sekce')];

    document.getElementById('rozbalitVse').addEventListener('click', () => {
      vsechnySekce().forEach(s => setCollapsed(s, false));
      saveCollapsed();
    });
    document.getElementById('sbalitVse').addEventListener('click', () => {
      vsechnySekce().forEach(s => setCollapsed(s, true));
      saveCollapsed();
    });

    /* ---- Oblíbené & historie ---- */
    function toggleOblibena(soubor) {
      const i = oblibene.indexOf(soubor);
      if (i >= 0) oblibene.splice(i, 1);
      else oblibene.push(soubor);
      uloz(localStorage, KEY_OBLIBENE, JSON.stringify(oblibene));
      renderMenu();
    }
    function obnovHvezdy() {
      menuSekceEl.querySelectorAll('li').forEach(li => {
        const a = li.querySelector('a[data-page]');
        const st = li.querySelector('.hvezda');
        if (a && st) st.classList.toggle('je-oblibena', oblibene.includes(a.dataset.page));
      });
    }
    // Menu sekci „Nedávné“ nemá; historie se vede kvůli dlaždicím
    // „🕘 Naposledy otevřené“ na úvodním přehledu (obsah/prehled.html).
    function pridejNedavnou(soubor) {
      if (soubor === DOMOVSKA) return;
      nedavne = [soubor, ...nedavne.filter(f => f !== soubor)].slice(0, 8);
      uloz(localStorage, KEY_NEDAVNE, JSON.stringify(nedavne));
    }

    /* ---- Otevírání aplikací (hash = deep-link) ---- */
    let aktualni = null;

    function updateActiveLink(page) {
      menuSekceEl.querySelectorAll('a[data-page]').forEach(a => {
        a.classList.toggle('active', a.dataset.page === page);
      });
    }

    /* zUzivatele = navigaci vyvolal uživatel (klik v menu, změna hashe, zpráva
       z iframu). Při obnovení stránky (F5) je false: sbalení sekcí si uživatel
       nastavil sám a automatické rozbalení sekce s otevřenou aplikací by mu ho
       po každém načtení přepsalo. */
    function otevri(page, zUzivatele = true) {
      if (!page || page === aktualni) return;
      if (!podleSouboru.has(page) && !STRANKY_MIMO_KATALOG.includes(page)) {
        // neznámý hash – nechodit mimo katalog
        page = DOMOVSKA;
      }
      aktualni = page;
      iframe.src = page;
      uloz(sessionStorage, KEY_PAGE, page);
      pridejNedavnou(page);
      updateActiveLink(page);
      // sekci s aktivní aplikací rozbalit – jen když aplikaci otevřel uživatel
      if (zUzivatele) {
        const a = menuSekceEl.querySelector(`a[data-page="${CSS.escape(page)}"]`);
        const s = a?.closest('.sekce');
        if (s && !s.dataset.special) { setCollapsed(s, false); saveCollapsed(); }
      }
      if (window.matchMedia('(max-width: 1024px)').matches) closeMenu();
    }

    // hash je buď cesta ke stránce, nebo výběr předmětu (#skupina=matematika)
    function zpracujHash(hash, zUzivatele = true) {
      if (hash.startsWith('skupina=')) {
        vyberSkupinu(hash.slice(8), zUzivatele);
        otevri(DOMOVSKA, zUzivatele);
        return;
      }
      if (hash.startsWith('rocnik=')) {
        vyberRocnik(hash.slice(7));
        otevri(DOMOVSKA, zUzivatele);
        return;
      }
      otevri(hash || DOMOVSKA, zUzivatele);
    }

    window.addEventListener('hashchange', () => {
      zpracujHash(decodeURIComponent(location.hash.slice(1)));
    });

    // úvodní přehled (v iframe) může požádat o otevření aplikace nebo o předmět
    window.addEventListener('message', e => {
      if (!e.data) return;
      if (typeof e.data.otevri === 'string') {
        location.hash = e.data.otevri;
        otevri(e.data.otevri);
      } else if (typeof e.data.skupina === 'string') {
        vyberSkupinu(e.data.skupina);
      } else if (typeof e.data.rocnik === 'string') {
        vyberRocnik(e.data.rocnik);
      }
    });

    document.getElementById('btnDomu').addEventListener('click', () => {
      history.pushState(null, '', location.pathname);
      otevri(DOMOVSKA);
    });
    document.getElementById('btnOsnova').addEventListener('click', () => {
      location.hash = 'obsah/osnova.html';
    });
    document.getElementById('btnUcitel').addEventListener('click', () => {
      location.hash = 'obsah/ucitel.html';
    });
    document.getElementById('btnPredstaveni').addEventListener('click', () => {
      location.hash = 'obsah/predstaveni.html';
    });
    document.getElementById('btnNoveOkno').addEventListener('click', () => {
      window.open(aktualni || DOMOVSKA, '_blank');
    });

    /* ---- Přepínání tématu ---- */
    // theme.js už téma použil při načtení; tady se jen vybírá ze seznamu a rozesílá.
    const temaVolba = document.getElementById('temaVolba');
    const themeColor = document.querySelector('meta[name="theme-color"]');
    // „motiv“ je rodu mužského – vlastní tvary, ne MetodusTheme.name() („světlé téma“)
    const MOTIVY = {
      auto: ['🖥️', 'Podle systému'], dark: ['🌙', 'Tmavý', '#2d2d2d'], light: ['☀️', 'Světlý', '#ffffff'],
      kontrast: ['🔲', 'Vysoký kontrast', '#ffffff'],
      sepia: ['📜', 'Sépie', '#e9ddbe'], knihovna: ['📚', 'Stará knihovna', '#2c2118'],
      skola: ['✏️', 'Škola', '#f6f8f4'], 'nocni-skola': ['🦉', 'Noční škola', '#244236']
    };
    // Základní motivy řeší čitelnost (i na projektoru), tematické náladu; skupiny drží seznam přehledný.
    const SKUPINY = [['Základní', ['auto', 'dark', 'light', 'kontrast']], ['Tematické', ['sepia', 'knihovna', 'skola', 'nocni-skola']]];
    temaVolba.replaceChildren(...SKUPINY.map(([nazev, motivy]) => {
      const g = document.createElement('optgroup'); g.label = nazev;
      g.append(...motivy.filter(t => MetodusTheme.themes.includes(t)).map(t => new Option(MOTIVY[t][0] + ' ' + MOTIVY[t][1], t)));
      return g;
    }));

    function zobrazTema() {
      const tema = MetodusTheme.get();
      temaVolba.value = tema;
      temaVolba.title = 'Barevný motiv: ' + MOTIVY[tema][1];
      if (themeColor) themeColor.content = MOTIVY[MetodusTheme.rendered()][2];
    }
    zobrazTema();
    temaVolba.addEventListener('change', () => {
      MetodusTheme.set(temaVolba.value);
      // v nabídce „Další“ volba nabídku zavře jako ostatní položky
      if (temaVolba.closest('.vice-menu')) setViceOpen(false);
    });
    window.addEventListener('metodus-theme', zobrazTema);
    // Nová lekce přebírá aktuální motiv i při zablokovaném localStorage.
    iframe.addEventListener('load', () => iframe.contentWindow?.postMessage({ tema: MetodusTheme.get() }, '*'));
    window.addEventListener('message', e => {
      if (e.source === iframe.contentWindow && MetodusTheme.themes.includes(e.data?.metodusTemaVolba)) {
        MetodusTheme.set(e.data.metodusTemaVolba);
      }
    });

    /* ---- Pilulky předmětů a ročníků ---- */
    const pills = [];
    const rocnikPills = [];

    // Počet v pilulce vždy ukazuje, kolik položek zbude po započtení
    // ostatních os filtru – aby nesliboval víc, než kolik se po kliknutí zobrazí.
    function skupinaPocet(id) {
      return VSECHNY.filter(p => (id === 'vse' || p.skupina === id) && projdePolozka(p)).length;
    }
    function rocnikPocet(r) {
      return VSECHNY.filter(p => {
        if (!zobrazPlan && p.stav === 'plan') return false;
        if (aktivniSkupina !== 'vse' && p.skupina !== aktivniSkupina) return false;
        return r === 'vse' || (p.rocniky || []).map(String).includes(r);
      }).length;
    }
    function prepoctiPocty() {
      pills.forEach(b => {
        const n = skupinaPocet(b.dataset.skupina);
        b.querySelector('.pill-pocet').textContent = n;
        b.disabled = false;
      });
      rocnikPills.forEach(b => {
        const n = rocnikPocet(b.dataset.rocnik);
        b.textContent = b.dataset.popisek + (n ? '' : '');
        b.disabled = n === 0 && b.dataset.rocnik !== 'vse';
        b.title = n + ' položek';
      });
    }
    function updatePillState() {
      pills.forEach(p => p.classList.toggle('active', p.dataset.skupina === aktivniSkupina));
      rocnikPills.forEach(p => p.classList.toggle('active', p.dataset.rocnik === aktivniRocnik));
      const aktivni = pills.find(p => p.dataset.skupina === aktivniSkupina);
      // popisek pilulky už vlastní emoji obsahuje, další prefix by se zdvojil
      skupinyToggleLabel.textContent = aktivni ? aktivni.querySelector('span').textContent : '📚 Vše';
    }
    function vyberRocnik(r) {
      if (!rocnikPills.some(p => p.dataset.rocnik === r)) return;
      aktivniRocnik = r;
      uloz(localStorage, KEY_ROCNIK, r);
      nastavDotaz('');
      updatePillState();
      aplikujFiltr();
    }

    function vyberSkupinu(id, zUzivatele = true) {
      if (!pills.some(p => p.dataset.skupina === id)) return;
      aktivniSkupina = id;
      uloz(localStorage, KEY_SKUPINA, id);
      nastavDotaz('');
      // po přepnutí předmětu se sekce sbalí — cílem je přehled okruhů,
      // ne sloupec desítek položek, kterým se musí projet. Při obnovení stránky
      // s hashem #skupina=… se ale nesbalují: to by po každém F5 smazalo,
      // co si uživatel rozbalil.
      if (zUzivatele) {
        vsechnySekce().forEach(s => setCollapsed(s, true));
        saveCollapsed();
      }
      updatePillState();
      aplikujFiltr();
      setSkupinyOpen(false);
      if (window.matchMedia('(max-width: 1024px)').matches) openMenu();
      menuEl.scrollTop = 0;
    }

    function makePill(id, label) {
      const b = document.createElement('button');
      b.className = 'skupina-pill';
      b.dataset.skupina = id;
      b.innerHTML = `<span>${label}</span><span class="pill-pocet">${skupinaPocet(id)}</span>`;
      b.addEventListener('click', () => vyberSkupinu(id));
      skupinyEl.appendChild(b);
      pills.push(b);
    }
    makePill('vse', '📚 Vše');
    KATALOG_SKUPINY.forEach(g => {
      if (KATALOG_SEKCE.some(s => s.skupina === g.id)) makePill(g.id, g.label);
    });
    if (!pills.some(p => p.dataset.skupina === aktivniSkupina)) aktivniSkupina = 'vse';

    function makeRocnikPill(r, popisek) {
      const b = document.createElement('button');
      b.className = 'rocnik-pill';
      b.dataset.rocnik = r;
      b.dataset.popisek = popisek;
      b.textContent = popisek;
      b.addEventListener('click', () => vyberRocnik(r));
      rocnikyEl.appendChild(b);
      rocnikPills.push(b);
    }
    makeRocnikPill('vse', 'Vše');
    for (let r = 1; r <= 9; r++) makeRocnikPill(String(r), r + '.');
    if (!rocnikPills.some(p => p.dataset.rocnik === aktivniRocnik)) aktivniRocnik = 'vse';

    // Přepínač má smysl jen tehdy, když katalog nějaké připravované téma
    // opravdu obsahuje. Když je všechno hotové, jen by mátl.
    const maPlan = VSECHNY.some(p => p.stav === 'plan');
    if (!maPlan) {
      prepinacPlanObal.hidden = true;
      zobrazPlan = true;
    }

    prepinacPlan.checked = zobrazPlan;
    prepinacPlan.addEventListener('change', () => {
      zobrazPlan = prepinacPlan.checked;
      uloz(localStorage, KEY_PLAN, zobrazPlan ? '1' : '0');
      aplikujFiltr();
    });

    updatePillState();

    /* ---- Hledání (hlavička + menu) + filtr skupin ---- */
    const hledatMenu = document.getElementById('hledatMenu');
    const searchInputs = [hledatMenu];

    function nastavDotaz(val) {
      searchInputs.forEach(i => { i.value = val; });
    }
    function aktualniDotaz() {
      const i = searchInputs.find(x => x.value.trim());
      return i ? norm(i.value.trim()) : '';
    }

    /* Filtr má tři nezávislé osy: předmět (sekce), ročník a zobrazení
       připravovaných stránek. Hledání je čtvrtá – platí přes všechny sekce. */
    function projdeRocnikem(rocniky) {
      if (aktivniRocnik === 'vse') return true;
      return rocniky.includes(aktivniRocnik);
    }

    function projdePolozka(p) {
      if (!zobrazPlan && p.stav === 'plan') return false;
      return projdeRocnikem((p.rocniky || []).map(String));
    }

    function projdeOdkaz(a) {
      if (!zobrazPlan && a.dataset.plan === '1') return false;
      return projdeRocnikem(a.dataset.rocniky ? a.dataset.rocniky.split(',') : []);
    }

    function aplikujFiltr() {
      const q = aktualniDotaz();
      zrusKbFokus();
      let celkemShod = 0;
      vsechnySekce().forEach(s => {
        // oblíbené se při hledání schovají (jinak by se položky zdvojily)
        if (q && s.dataset.special) { s.classList.add('skryto'); return; }
        const patri = s.dataset.special || aktivniSkupina === 'vse'
          || s.dataset.skupina === aktivniSkupina;
        let shoda = 0;
        s.querySelectorAll('li').forEach(li => {
          const a = li.querySelector('a[data-page]');
          const ok = projdeOdkaz(a) && (!q || a.dataset.hledani.includes(q));
          li.classList.toggle('skryto', !ok);
          a.classList.toggle('zvyrazneno', !!q && ok);
          if (ok) shoda++;
        });
        s.classList.toggle('skryto', !patri || shoda === 0);
        if (patri && shoda > 0) {
          if (q) s.classList.remove('collapsed');
          else s.classList.toggle('collapsed',
            !s.classList.contains('jedina') && collapsedSet.has(s.dataset.nazev));
          if (!s.dataset.special) celkemShod += shoda;
        }
      });
      bezVysledku.classList.toggle('zobraz', celkemShod === 0);
      zobrazZruseni();
      prepoctiPocty();
    }

    /* Zrušení filtrů je vidět jen tehdy, když nějaký filtr opravdu ubírá
       položky — a rovnou pojmenuje, co zruší. Jinak uživatel na telefonu
       nepozná, proč vidí jen část katalogu. */
    const zrusitFiltry = document.getElementById('zrusitFiltry');
    const zrusitCo = document.getElementById('zrusitCo');
    function zobrazZruseni() {
      const co = [];
      if (aktivniSkupina !== 'vse') {
        const p = pills.find(x => x.dataset.skupina === aktivniSkupina);
        co.push('předmět ' + (p ? p.querySelector('span').textContent.trim() : aktivniSkupina));
      }
      if (aktivniRocnik !== 'vse') co.push(aktivniRocnik + '. ročník');
      if (aktualniDotaz()) co.push('hledání');
      if (maPlan && !zobrazPlan) co.push('skryté připravované 🚧');
      zrusitFiltry.hidden = co.length === 0;
      zrusitCo.textContent = co.length ? 'zruší: ' + co.join(', ') : '';
    }
    zrusitFiltry.addEventListener('click', () => {
      aktivniSkupina = 'vse'; uloz(localStorage, KEY_SKUPINA, 'vse');
      aktivniRocnik = 'vse'; uloz(localStorage, KEY_ROCNIK, 'vse');
      if (maPlan) { zobrazPlan = true; prepinacPlan.checked = true; uloz(localStorage, KEY_PLAN, '1'); }
      nastavDotaz('');
      updatePillState();
      aplikujFiltr();
      menuEl.scrollTop = 0;
      hledatMenu.focus();
    });

    searchInputs.forEach(input => {
      input.addEventListener('input', () => {
        nastavDotaz(input.value);
        aplikujFiltr();
      });
    });

    /* ---- Klávesové ovládání ---- */
    let kbIndex = -1;
    function viditelneOdkazy() {
      return vsechnySekce()
        .filter(s => !s.classList.contains('skryto') && !s.classList.contains('collapsed'))
        .flatMap(s => [...s.querySelectorAll('li:not(.skryto) a[data-page]')]);
    }
    function zrusKbFokus() {
      kbIndex = -1;
      menuSekceEl.querySelectorAll('a.kb-focus').forEach(a => a.classList.remove('kb-focus'));
    }
    function posunKbFokus(smer) {
      const odkazy = viditelneOdkazy();
      if (!odkazy.length) return;
      kbIndex = (kbIndex + smer + odkazy.length) % odkazy.length;
      menuSekceEl.querySelectorAll('a.kb-focus').forEach(a => a.classList.remove('kb-focus'));
      const cil = odkazy[kbIndex];
      cil.classList.add('kb-focus');
      cil.scrollIntoView({ block: 'nearest' });
    }

    document.addEventListener('keydown', e => {
      const vInputu = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        (window.matchMedia('(max-width: 1024px)').matches ? openMenu : () => {})();
        hledatMenu.focus();
        hledatMenu.select();
        return;
      }
      if (e.key === '/' && !vInputu) {
        e.preventDefault();
        hledatMenu.focus();
        hledatMenu.select();
        return;
      }
      if (e.key === 'F8') { e.preventDefault(); nastavProjektor(!projektorZap); return; }
      if (e.key === 'Escape') {
        if (!viceMenu.hidden) { setViceOpen(false); btnVice.focus(); return; }
        if (document.body.classList.contains('menu-nad')) {
          document.body.classList.remove('menu-nad'); return;
        }
        if (projektorZap) { nastavProjektor(false); return; }
        if (skupinyEl.classList.contains('show')) { setSkupinyOpen(false); skupinyToggle.focus(); return; }
        if (aktualniDotaz()) { nastavDotaz(''); aplikujFiltr(); }
        closeMenu();
        return;
      }
      if (vInputu && searchInputs.includes(document.activeElement)) {
        if (e.key === 'ArrowDown') { e.preventDefault(); posunKbFokus(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); posunKbFokus(-1); }
        else if (e.key === 'Enter') {
          const foc = menuSekceEl.querySelector('a.kb-focus') || viditelneOdkazy()[0];
          if (foc) { location.hash = foc.dataset.page; nastavDotaz(''); aplikujFiltr(); }
        }
      }
    });

    /* ---- Hamburger: vysouvací menu na telefonu a tabletu ---- */
    const hamburger = document.getElementById('hamburger');
    const menuOverlay = document.getElementById('menuOverlay');

    function openMenu(fokus = false) {
      menuEl.classList.add('open');
      menuOverlay.classList.add('show');
      hamburger.setAttribute('aria-expanded', 'true');
      hamburger.setAttribute('aria-label', 'Zavřít menu');
      // Klávesnice i čtečka musí po otevření skončit uvnitř menu, ne za ním.
      if (fokus) hledatMenu.focus();
    }
    function closeMenu() {
      const bylUvnitr = menuEl.contains(document.activeElement);
      menuEl.classList.remove('open');
      menuOverlay.classList.remove('show');
      hamburger.setAttribute('aria-expanded', 'false');
      hamburger.setAttribute('aria-label', 'Otevřít menu');
      if (bylUvnitr && window.matchMedia('(max-width: 1024px)').matches) hamburger.focus();
    }
    hamburger.addEventListener('click', () =>
      menuEl.classList.contains('open') ? closeMenu() : openMenu(true));
    menuOverlay.addEventListener('click', closeMenu);

    /* ---- Nabídka „Další": na úzké obrazovce sdružuje akce z hlavičky ----
       Tlačítka se přesouvají, ne kopírují — zůstávají jim posluchače i stav
       (zvýrazněný projektor, zvolený motiv). */
    const ovladaniEl = document.getElementById('ovladani');
    const btnVice = document.getElementById('btnVice');
    const viceMenu = document.getElementById('viceMenu');
    const doNabidky = ['btnOsnova', 'btnUcitel', 'btnPredstaveni', 'temaObal', 'btnProjektor', 'btnNoveOkno']
      .map(id => document.getElementById(id));
    const uzkaHlavicka = window.matchMedia('(max-width: 700px)');

    function setViceOpen(open) {
      viceMenu.hidden = !open;
      btnVice.setAttribute('aria-expanded', String(open));
      if (open) viceMenu.querySelector('button:not([disabled])')?.focus();
    }
    function presunOvladani() {
      const uzka = uzkaHlavicka.matches;
      btnVice.hidden = !uzka;
      if (!uzka) setViceOpen(false);
      doNabidky.forEach(b => {
        const cil = uzka ? viceMenu : ovladaniEl;
        if (b.parentElement !== cil) {
          // výklopný seznam motivů zůstává seznamem, položkou nabídky jsou jen tlačítka
          if (b.tagName === 'BUTTON') { if (uzka) b.setAttribute('role', 'menuitem'); else b.removeAttribute('role'); }
          cil.insertBefore(b, uzka ? null : document.getElementById('rozbalitVse'));
        }
      });
    }
    presunOvladani();
    uzkaHlavicka.addEventListener('change', presunOvladani);

    btnVice.addEventListener('click', e => {
      e.stopPropagation();
      setViceOpen(viceMenu.hidden);
    });
    // Šipky procházejí nabídkou, Esc ji zavře a vrátí fokus na tlačítko.
    viceMenu.addEventListener('keydown', e => {
      const polozky = [...viceMenu.querySelectorAll('button, select')];
      const i = polozky.indexOf(document.activeElement);
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const posun = e.key === 'ArrowDown' ? 1 : -1;
        polozky[(i + posun + polozky.length) % polozky.length].focus();
      } else if (e.key === 'Home' || e.key === 'End') {
        e.preventDefault();
        (e.key === 'Home' ? polozky[0] : polozky[polozky.length - 1]).focus();
      }
    });
    // volba akce nabídku zavře (tlačítka si svou práci odbaví sama)
    viceMenu.addEventListener('click', e => { if (e.target.closest('button')) setViceOpen(false); });
    document.addEventListener('click', e => {
      if (!viceMenu.hidden && !e.target.closest('.vice-obal')) setViceOpen(false);
    });
    // odchod tabulátorem mimo nabídku ji také zavře
    document.addEventListener('focusin', e => {
      if (!viceMenu.hidden && !e.target.closest('.vice-obal')) setViceOpen(false);
    });

    window.addEventListener('resize', () => {
      if (!window.matchMedia('(max-width: 1024px)').matches) closeMenu();
    });


    /* ---- Režim projektor ----
       Zvětšuje se rám s aplikací (projektor.js), stránky uvnitř se nemění.
       Úroveň si režim pamatuje, takže se druhé zapnutí trefí do stejného
       zvětšení jako minulá hodina. */
    const KEY_PROJEKTOR = 'metodus_projektor';
    const projLista = document.getElementById('projektorLista');
    const projUroven = document.getElementById('projUroven');
    const btnProjektor = document.getElementById('btnProjektor');
    let projektorZap = false;
    let projektorK = Number(precti(localStorage, KEY_PROJEKTOR)) || 1.5;

    function zobrazUroven() {
      projUroven.textContent = Math.round(projektorK * 100) + ' %';
      btnProjektor.classList.toggle('aktivni', projektorZap);
      btnProjektor.setAttribute('aria-pressed', String(projektorZap));
    }

    function pouzijProjektor() {
      if (projektorZap) Projektor.uprav(iframe, projektorK);
      else Projektor.zrus(iframe);
      zobrazUroven();
    }

    // V celé obrazovce spolkne Esc prohlížeč (ukončí jen fullscreen) a režim
    // projektor by zůstal zapnutý bez zvětšení. Odchod z celé obrazovky proto
    // ukončí i režim — jedno Esc tedy dělá to, co slibuje popisek tlačítka.
    document.addEventListener('fullscreenchange', () => {
      if (projektorZap && !document.fullscreenElement) nastavProjektor(false);
    });

    function nastavProjektor(zap) {
      projektorZap = zap;
      document.body.classList.toggle('projektor', zap);
      if (!zap) document.body.classList.remove('menu-nad');
      // Rám se přepočítává až po překreslení – hlavička a menu mizí ve stejném
      // snímku a plocha by se jinak změřila ještě ve staré velikosti.
      requestAnimationFrame(pouzijProjektor);
      if (zap) Projektor.celaObrazovka(document.documentElement);
      else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    }

    function zmenUroven(smer) {
      projektorK = Projektor.posun(projektorK, smer);
      uloz(localStorage, KEY_PROJEKTOR, String(projektorK));
      pouzijProjektor();
    }

    btnProjektor.addEventListener('click', () => nastavProjektor(!projektorZap));
    document.getElementById('projVetsi').addEventListener('click', () => zmenUroven(1));
    document.getElementById('projMensi').addEventListener('click', () => zmenUroven(-1));
    document.getElementById('projKonec').addEventListener('click', () => nastavProjektor(false));
    document.getElementById('projFull').addEventListener('click', () =>
      Projektor.celaObrazovka(document.documentElement));
    document.getElementById('projMenu').addEventListener('click', e => {
      e.stopPropagation();
      document.body.classList.toggle('menu-nad');
    });
    menuOverlay.addEventListener('click', () => document.body.classList.remove('menu-nad'));
    menuSekceEl.addEventListener('click', e => {
      if (e.target.closest('a[data-page]')) document.body.classList.remove('menu-nad');
    });
    window.addEventListener('resize', pouzijProjektor);
    document.addEventListener('fullscreenchange', () => requestAnimationFrame(pouzijProjektor));
    zobrazUroven();

    /* ---- Start ---- */
    renderMenu();
    const zHashe = decodeURIComponent(location.hash.slice(1));
    // false = obnovení stránky, ne akce uživatele -> sbalení sekcí zůstane, jak si ho nastavil
    if (zHashe) zpracujHash(zHashe, false);
    else otevri(precti(sessionStorage, KEY_PAGE) || DOMOVSKA, false);

    /* ---- PWA ---- */
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
