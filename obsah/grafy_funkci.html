<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grafy funkcí</title>
  <link rel="stylesheet" href="../common.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../kostra.js" defer></script>
  <style>
    body { background-color: var(--bg-deep); padding: 24px clamp(14px, 3vw, 40px); min-height: 100vh; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .podtitul { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 16px; }
    .plocha { display: flex; gap: 16px; flex-wrap: wrap; max-width: 1000px; }
    .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .graf-obal { flex: 1 1 420px; min-width: 300px; }
    canvas { width: 100%; height: auto; display: block; border-radius: 6px; background: var(--bg-deep); }
    .nastaveni { flex: 0 1 320px; }
    .typy { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .typy button { background: var(--bg-control); border: 1px solid var(--border-strong); color: var(--text-muted); border-radius: 6px; padding: 6px 11px; font-size: 0.82rem; cursor: pointer; }
    .typy button.active { background: var(--accent); border-color: var(--accent); color: var(--na-akcentu, #fff); font-weight: 600; }
    .predpis { font-family: Georgia, serif; font-size: 1.15rem; margin-bottom: 14px; text-align: center; color: var(--accent); min-height: 1.6rem; }
    .tahlo { margin-bottom: 12px; }
    .tahlo label { display: flex; justify-content: space-between; font-size: 0.88rem; color: var(--text-muted); margin-bottom: 4px; }
    .tahlo output { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .popis { font-size: 0.84rem; color: var(--text-faint); line-height: 1.6; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
    canvas { cursor: crosshair; touch-action: none; }

    .odecet {
      display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
      margin-top: 10px; font-size: 0.86rem; color: var(--text-muted);
      font-variant-numeric: tabular-nums; min-height: 1.6rem;
    }
    .odecet .bod { color: var(--accent); font-weight: 700; }
    .odecet .nuly { color: var(--ok); font-weight: 600; }
    .odecet .prusecik-y { color: var(--warn); font-weight: 600; }

    .trefa {
      margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px;
    }
    .trefa .radek { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .trefa button {
      background: var(--bg-control); border: 1px solid var(--border-strong); color: var(--text);
      border-radius: 8px; padding: 8px 14px; font-size: 0.84rem; font-family: inherit; cursor: pointer;
    }
    .trefa button:hover { border-color: var(--accent); }
    .trefa button.hlavni { background: var(--accent); border-color: var(--accent); color: var(--na-akcentu, #fff); font-weight: 600; }
    .presnost { font-size: 0.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .presnost.dobre { color: var(--ok); }
    .presnost.stredne { color: var(--warn); }
    .presnost.spatne { color: var(--danger); }
    .trefa .naseptavac { font-size: 0.8rem; color: var(--text-faint); margin-top: 6px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>📈 Grafy funkcí</h1>
  <p class="podtitul">Interaktivní vykreslování základních funkcí – posouvej parametry a sleduj, co se s grafem děje (9. ročník ZŠ, SŠ).</p>

  <div class="plocha">
    <div class="panel graf-obal"><canvas id="graf" width="640" height="480"></canvas></div>
    <div class="panel nastaveni">
      <div class="typy" id="typy"></div>
      <div class="predpis" id="predpis"></div>
      <div id="tahla"></div>
      <div class="odecet" id="odecet"></div>
      <div class="trefa">
        <div class="radek">
          <button id="btnTrefa" class="hlavni">🎯 Trefa: uhodni parametry</button>
          <span class="presnost" id="presnost"></span>
        </div>
        <div class="naseptavac" id="naseptavac">
          Vygeneruje se šedý graf s náhodnými parametry. Posuvníky se ho pokus překrýt.
        </div>
      </div>
      <div class="popis" id="popis"></div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const canvas = $('graf'), ctx = canvas.getContext('2d');

const FUNKCE = [
  { id: 'lin', nazev: 'Lineární', predpis: p => `y = ${p.a}·x ${p.b < 0 ? '−' : '+'} ${Math.abs(p.b)}`,
    f: p => x => p.a * x + p.b,
    parametry: { a: [-5, 5, 0.1, 1], b: [-5, 5, 0.1, 0] },
    popis: 'Přímka. Parametr a určuje sklon (a > 0 roste, a < 0 klesá), b posouvá přímku po ose y.' },
  { id: 'kvadr', nazev: 'Kvadratická', predpis: p => `y = ${p.a}·x² ${p.b < 0 ? '−' : '+'} ${Math.abs(p.b)}·x ${p.c < 0 ? '−' : '+'} ${Math.abs(p.c)}`,
    f: p => x => p.a * x * x + p.b * x + p.c,
    parametry: { a: [-3, 3, 0.1, 1], b: [-5, 5, 0.1, 0], c: [-5, 5, 0.1, 0] },
    popis: 'Parabola. a určuje otevření (a > 0 nahoru, a < 0 dolů) a šířku, c posouvá vrchol po ose y.' },
  { id: 'abs', nazev: '|x|', predpis: p => `y = ${p.a}·|x ${p.b < 0 ? '−' : '+'} ${Math.abs(p.b)}| ${p.c < 0 ? '−' : '+'} ${Math.abs(p.c)}`,
    f: p => x => p.a * Math.abs(x + p.b) + p.c,
    parametry: { a: [-3, 3, 0.1, 1], b: [-5, 5, 0.1, 0], c: [-5, 5, 0.1, 0] },
    popis: 'Lomená čára tvaru V. Parametr b posouvá vrchol vodorovně, c svisle.' },
  { id: 'neprima', nazev: 'k/x', predpis: p => `y = ${p.a} / x`,
    f: p => x => p.a / x,
    parametry: { a: [-6, 6, 0.1, 2] },
    popis: 'Nepřímá úměrnost – hyperbola. Není definována pro x = 0. Znaménko a překlápí větve.' },
  { id: 'sin', nazev: 'sinus', predpis: p => `y = ${p.a}·sin(${p.b}·x)`,
    f: p => x => p.a * Math.sin(p.b * x),
    parametry: { a: [-3, 3, 0.1, 1], b: [0.2, 4, 0.1, 1] },
    popis: 'Vlna. a je amplituda (výška vln), b frekvence (hustota vln).' },
  { id: 'cos', nazev: 'kosinus', predpis: p => `y = ${p.a}·cos(${p.b}·x)`,
    f: p => x => p.a * Math.cos(p.b * x),
    parametry: { a: [-3, 3, 0.1, 1], b: [0.2, 4, 0.1, 1] },
    popis: 'Stejná vlna jako sinus, posunutá o čtvrt periody – v x = 0 začíná v maximu.' },
  { id: 'exp', nazev: 'exponenciální', predpis: p => `y = ${p.a}ˣ`,
    f: p => x => Math.pow(p.a, x),
    parametry: { a: [0.2, 3, 0.05, 2] },
    popis: 'Pro a > 1 prudce roste, pro 0 < a < 1 klesá. Vždy prochází bodem [0; 1].' },
  { id: 'odm', nazev: '√x', predpis: p => `y = ${p.a}·√x`,
    f: p => x => x < 0 ? NaN : p.a * Math.sqrt(x),
    parametry: { a: [-3, 3, 0.1, 1] },
    popis: 'Odmocnina je definována jen pro x ≥ 0. Je to „položená“ polovina paraboly.' },
];

let aktualni = FUNKCE[0];
let hodnoty = {};

const ROZSAH = 8;   // osa x i y od -8 do 8

function souradnice(x, y) {
  return [ (x + ROZSAH) / (2 * ROZSAH) * canvas.width, (ROZSAH - y) / (2 * ROZSAH) * canvas.height ];
}
function kresli() {
  const w = canvas.width, h = canvas.height;
  const styl = getComputedStyle(document.documentElement);
  ctx.clearRect(0, 0, w, h);
  // mřížka
  ctx.strokeStyle = styl.getPropertyValue('--border').trim() || '#404040';
  ctx.lineWidth = 1;
  ctx.font = '12px sans-serif';
  ctx.fillStyle = styl.getPropertyValue('--text-faint').trim() || '#888';
  for (let i = -ROZSAH; i <= ROZSAH; i += 2) {
    const [x1, y1] = souradnice(i, -ROZSAH), [x2, y2] = souradnice(i, ROZSAH);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    const [x3, y3] = souradnice(-ROZSAH, i), [x4, y4] = souradnice(ROZSAH, i);
    ctx.beginPath(); ctx.moveTo(x3, y3); ctx.lineTo(x4, y4); ctx.stroke();
    if (i) {
      const [tx, ty] = souradnice(i, 0); ctx.fillText(i, tx + 3, ty + 14);
      const [tx2, ty2] = souradnice(0, i); ctx.fillText(i, tx2 + 5, ty2 - 3);
    }
  }
  // osy
  ctx.strokeStyle = styl.getPropertyValue('--text-muted').trim() || '#b0b0b0';
  ctx.lineWidth = 1.6;
  let [ox1, oy1] = souradnice(-ROZSAH, 0), [ox2, oy2] = souradnice(ROZSAH, 0);
  ctx.beginPath(); ctx.moveTo(ox1, oy1); ctx.lineTo(ox2, oy2); ctx.stroke();
  [ox1, oy1] = souradnice(0, -ROZSAH); [ox2, oy2] = souradnice(0, ROZSAH);
  ctx.beginPath(); ctx.moveTo(ox1, oy1); ctx.lineTo(ox2, oy2); ctx.stroke();
  // cílová křivka režimu Trefa (šedá, pod vlastní křivkou)
  if (cil) {
    ctx.strokeStyle = styl.getPropertyValue('--text-faint').trim() || '#888';
    ctx.lineWidth = 5;
    ctx.globalAlpha = 0.55;
    kresliKrivku(aktualni.f(cil));
    ctx.globalAlpha = 1;
  }

  // funkce
  const f = aktualni.f(hodnoty);
  ctx.strokeStyle = styl.getPropertyValue('--accent').trim() || '#6aa6fd';
  ctx.lineWidth = 2.6;
  kresliKrivku(f);

  vyznacPruseciky(f, styl);
  if (odecetX !== null) vyznacBod(f, styl);

  $('predpis').textContent = aktualni.predpis(zaokrouhlene());
  $('popis').textContent = '💡 ' + aktualni.popis;
  aktualizujOdecet(f);
  if (cil) aktualizujPresnost(f);
}
function kresliKrivku(f) {
  const w = canvas.width;
  ctx.beginPath();
  let kreslim = false;
  for (let px = 0; px <= w; px++) {
    const x = px / w * 2 * ROZSAH - ROZSAH;
    const y = f(x);
    if (!isFinite(y) || isNaN(y) || Math.abs(y) > ROZSAH * 4) { kreslim = false; continue; }
    const [cx, cy] = souradnice(x, y);
    if (kreslim) ctx.lineTo(cx, cy); else { ctx.moveTo(cx, cy); kreslim = true; }
  }
  ctx.stroke();
}

/* Nulové body hledáme půlením tam, kde funkce mění znaménko. */
function nulyFunkce(f) {
  const nuly = [];
  const KROK = 0.02;
  let px = -ROZSAH, py = f(px);
  for (let x = -ROZSAH + KROK; x <= ROZSAH; x += KROK) {
    const y = f(x);
    if (isFinite(py) && isFinite(y) && py * y < 0 && Math.abs(y - py) < 4) {
      let a = px, b = x;
      for (let i = 0; i < 40; i++) {
        const m = (a + b) / 2;
        if (f(a) * f(m) <= 0) b = m; else a = m;
      }
      const koren = (a + b) / 2;
      if (!nuly.some(n => Math.abs(n - koren) < 0.05)) nuly.push(koren);
    }
    px = x; py = y;
  }
  return nuly.slice(0, 4);
}

function vyznacPruseciky(f, styl) {
  const terc = (x, y, barva) => {
    if (!isFinite(y) || Math.abs(y) > ROZSAH) return;
    const [cx, cy] = souradnice(x, y);
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fillStyle = barva; ctx.fill();
    ctx.strokeStyle = styl.getPropertyValue('--bg-deep').trim() || '#121212';
    ctx.lineWidth = 2; ctx.stroke();
  };
  nulyFunkce(f).forEach(x => terc(x, 0, styl.getPropertyValue('--ok').trim() || '#4caf7d'));
  const y0 = f(0);
  if (isFinite(y0)) terc(0, y0, styl.getPropertyValue('--warn').trim() || '#e0a63f');
}

function vyznacBod(f, styl) {
  const y = f(odecetX);
  if (!isFinite(y) || Math.abs(y) > ROZSAH) return;
  const [cx, cy] = souradnice(odecetX, y);
  const [, y0] = souradnice(odecetX, 0);
  const [x0] = souradnice(0, y);
  ctx.strokeStyle = styl.getPropertyValue('--accent').trim() || '#6aa6fd';
  ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, y0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x0, cy); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2);
  ctx.fillStyle = styl.getPropertyValue('--accent').trim() || '#6aa6fd'; ctx.fill();
}

/* Půlení intervalu vrací nulu klidně jako −1e−17; bez ošetření by se vypsalo „−0“. */
const fmtG = v => {
  const c = Math.abs(v) < 5e-3 ? 0 : Number(Number(v).toFixed(2));
  return c.toLocaleString('cs-CZ').replace('-', '−');
};

function aktualizujOdecet(f) {
  const nuly = nulyFunkce(f);
  const y0 = f(0);
  const casti = [];
  if (odecetX !== null) {
    const y = f(odecetX);
    casti.push(isFinite(y)
      ? `<span class="bod">[${fmtG(odecetX)}; ${fmtG(y)}]</span>`
      : `<span class="bod">x = ${fmtG(odecetX)} — není definováno</span>`);
  } else {
    casti.push('<span>Najeď myší (nebo klepni) do grafu a odečti bod.</span>');
  }
  if (nuly.length) casti.push(`<span class="nuly">nulové body: ${nuly.map(fmtG).join(', ')}</span>`);
  if (isFinite(y0)) casti.push(`<span class="prusecik-y">osa y: ${fmtG(y0)}</span>`);
  $('odecet').innerHTML = casti.join('');
}

/* ---- Trefa: uhodni parametry šedé křivky ---- */
let cil = null;
let odecetX = null;

function novaTrefa() {
  cil = {};
  for (const [jmeno, [min, max, krok]] of Object.entries(aktualni.parametry)) {
    const pocet = Math.floor((max - min) / krok);
    cil[jmeno] = +(min + Math.round(Math.random() * pocet) * krok).toFixed(2);
  }
  $('naseptavac').textContent = 'Posuvníky se pokus překrýt šedou křivku. '
    + 'Přesnost se počítá průběžně.';
  kresli();
}

function aktualizujPresnost(f) {
  const g = aktualni.f(cil);
  let soucet = 0, pocet = 0;
  for (let x = -ROZSAH; x <= ROZSAH; x += 0.1) {
    const a = f(x), b = g(x);
    if (!isFinite(a) || !isFinite(b) || Math.abs(b) > ROZSAH * 2) continue;
    soucet += Math.min(Math.abs(a - b), 8); pocet++;
  }
  const odchylka = pocet ? soucet / pocet : 8;
  const proc = Math.max(0, Math.round((1 - odchylka / 3) * 100));
  const el = $('presnost');
  el.textContent = 'shoda ' + proc + ' %';
  el.className = 'presnost ' + (proc >= 95 ? 'dobre' : proc >= 70 ? 'stredne' : 'spatne');
  if (proc >= 99) {
    $('naseptavac').innerHTML = '🎉 <b>Trefa!</b> Parametry sedí. Dej si další.';
  }
}

function zaokrouhlene() {
  const z = {};
  for (const k in hodnoty) z[k] = Math.round(hodnoty[k] * 100) / 100;
  return z;
}
function postavTahla() {
  hodnoty = {};
  $('tahla').innerHTML = '';
  for (const [jmeno, [min, max, krok, vychozi]] of Object.entries(aktualni.parametry)) {
    hodnoty[jmeno] = vychozi;
    const div = document.createElement('div');
    div.className = 'tahlo';
    div.innerHTML = `<label>parametr ${jmeno} <output>${vychozi}</output></label>
      <input type="range" min="${min}" max="${max}" step="${krok}" value="${vychozi}">`;
    const vstup = div.querySelector('input'), vystup = div.querySelector('output');
    vstup.oninput = () => { hodnoty[jmeno] = +vstup.value; vystup.textContent = vstup.value; kresli(); };
    $('tahla').appendChild(div);
  }
}
FUNKCE.forEach((fn, i) => {
  const b = document.createElement('button');
  b.textContent = fn.nazev;
  if (!i) b.classList.add('active');
  b.onclick = () => {
    document.querySelectorAll('#typy button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); aktualni = fn;
    cil = null; odecetX = null;
    $('presnost').textContent = '';
    $('naseptavac').textContent = 'Vygeneruje se šedý graf s náhodnými parametry. '
      + 'Posuvníky se ho pokus překrýt.';
    postavTahla(); kresli();
  };
  $('typy').appendChild(b);
});
/* odečítání bodu z grafu – myší i dotykem */
function zGrafu(ev) {
  const r = canvas.getBoundingClientRect();
  const pomer = canvas.width / r.width;
  const px = (ev.clientX - r.left) * pomer;
  odecetX = px / canvas.width * 2 * ROZSAH - ROZSAH;
  kresli();
}
canvas.addEventListener('pointermove', zGrafu);
canvas.addEventListener('pointerdown', zGrafu);
canvas.addEventListener('pointerleave', () => { odecetX = null; kresli(); });

$('btnTrefa').addEventListener('click', novaTrefa);

new MutationObserver(kresli).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
postavTahla(); kresli();
</script>
<script src="../badani.js"></script>
<script>
/* Úkoly k modelu (badani.js): předpověz → vyzkoušej → vysvětli.
   Sklon přímky, posun paraboly nahoru, vodorovný posun u |x + b|. */
(function(){
const cis=Badani.cislo;
const nahodne=p=>p[Math.floor(Math.random()*p.length)];
const moznost=(t,ok,proc)=>({t,ok,proc});
const funkce=id=>{ const i=FUNKCE.findIndex(f=>f.id===id); document.querySelectorAll('#typy button')[i].click(); };
const tahlo=jmeno=>[...document.querySelectorAll('#tahla .tahlo')].find(d=>d.querySelector('label').textContent.trim().startsWith('parametr '+jmeno+' ')).querySelector('input');
const nastav=mapa=>Object.entries(mapa).forEach(([k,v])=>{ const e=tahlo(k); e.value=v; e.dispatchEvent(new Event('input',{bubbles:true})); });
const je=(id,mapa)=>aktualni.id===id&&Object.entries(mapa).every(([k,v])=>Math.abs(hodnoty[k]-v)<1e-9);

Badani.start({
  zakryt:'#popis',   // popis funkce vysvětluje, co který parametr dělá
  ukoly:[
    { id:'sklon', nazev:'Sklon přímky',
      predpoved:{
        otazka:'Graf funkce <b>y = 1·x + 0</b> je rostoucí přímka. Co se s ní stane, když parametr <b>a</b> změníš na <b>−2</b>?',
        moznosti:['Posune se o 2 dílky dolů','Bude klesat a bude strmější','Zůstane rovnoběžná s původní'],
        spravna:1 },
      priprava(){ funkce('lin'); nastav({a:1,b:0}); },
      pokus:'Posuvníkem nastav <b>parametr a = −2</b> a sleduj přímku. Najeď myší na graf a odečti, kolik je y pro x = 1.',
      splneno:()=>je('lin',{a:-2,b:0}),
      ukaz(){ nastav({a:-2}); },
      pozorovani:'Přímka teď <b>klesá</b> a je dvakrát strmější: pro x = 1 je y = −2, pro x = 2 je y = −4. Stále prochází počátkem.',
      vysvetli:{
        otazka:'Co přesně říká parametr a?',
        moznosti:[
          moznost('O kolik se změní y, když x vzroste o 1. Záporné a znamená, že y klesá.',true),
          moznost('Kde přímka protne osu y.',false,'Průsečík s osou y určuje b. Přímka y = −2x pořád prochází počátkem.'),
          moznost('O kolik je přímka posunutá dolů.',false,'Posun určuje b. Parametr a mění sklon – přímka se kolem průsečíku s osou y otočila.')]},
      shrnuti:'U přímky <b>y = a·x + b</b> je <b>a sklon</b> (o kolik vzroste y, když x vzroste o 1; a < 0 → klesá) a <b>b průsečík s osou y</b>.' },

    { id:'posun', nazev:'Parabola nahoru',
      predpoved:{
        otazka:'Parabola <b>y = x²</b> má vrchol v počátku. Co s ní udělá změna parametru <b>c na +3</b> (y = x² + 3)?',
        moznosti:['Posune se o 3 nahoru','Posune se o 3 doprava','Zúží se'],
        spravna:0 },
      priprava(){ funkce('kvadr'); nastav({a:1,b:0,c:0}); },
      pokus:'Nastav <b>parametr c = 3</b> a sleduj, kam se přesune vrchol paraboly.',
      splneno:()=>je('kvadr',{a:1,b:0,c:3}),
      ukaz(){ nastav({c:3}); },
      pozorovani:'Celá parabola se posunula <b>o 3 nahoru</b>, vrchol je v bodě [0; 3]. Tvar se nezměnil.',
      vysvetli:{
        otazka:'Proč se parabola posunula nahoru a nezměnila tvar?',
        moznosti:[
          moznost('Ke každé hodnotě x² se přičte stejné číslo 3 – každý bod grafu se zvedne o 3.',true),
          moznost('c mění šířku paraboly.',false,'Šířku a směr otevření určuje a. Tvar zůstal stejný, jen se celý posunul.'),
          moznost('Vrchol je vždy v bodě [c; 0].',false,'Vrchol se posunul svisle do bodu [0; 3] – c přičítá hodnotu y, ne x.')]},
      shrnuti:'Přičtení čísla k celé funkci ji <b>posune svisle</b>: y = x² + 3 je parabola y = x² posunutá o 3 nahoru. Parametr <b>a</b> mění šířku a směr otevření.' },

    { id:'vodorovne', nazev:'Kam se posune vrchol |x + b|',
      predpoved:{
        otazka:'Graf <b>y = |x|</b> má vrchol v počátku. Kam se vrchol posune v grafu <b>y = |x + 2|</b>?',
        moznosti:['O 2 doprava','O 2 doleva','O 2 nahoru'],
        spravna:1 },
      priprava(){ funkce('abs'); nastav({a:1,b:0,c:0}); },
      pokus:'Nastav <b>parametr b = 2</b> a sleduj vrchol grafu. Najeď myší na vrchol a odečti jeho souřadnice.',
      splneno:()=>je('abs',{a:1,b:2,c:0}),
      ukaz(){ nastav({b:2}); },
      pozorovani:'Vrchol je v bodě <b>[−2; 0]</b> – posunul se <b>doleva</b>, i když jsme přičetli +2.',
      vysvetli:{
        otazka:'Proč „+2“ posunulo graf doleva?',
        moznosti:[
          moznost('Vrchol leží tam, kde je výraz v absolutní hodnotě nula: x + 2 = 0, tedy x = −2.',true),
          moznost('Model se spletl, +2 má posunout doprava.',false,'Dosaď x = −2: |−2 + 2| = 0 – tam je nejnižší bod. Doprava by graf posunulo |x − 2|.'),
          moznost('Absolutní hodnota vždycky obrací znaménko.',false,'Absolutní hodnota mění záporná čísla na kladná, ale polohu vrcholu určuje, kdy je výraz uvnitř roven nule.')]},
      shrnuti:'Přičtení čísla <b>k x</b> posouvá graf <b>vodorovně opačným směrem</b>: y = |x + 2| je y = |x| posunutá o 2 doleva, y = (x − 3)² je parabola posunutá o 3 doprava.' },
  ],

  otazky:[
    ()=>{ let a,b,x,y;
      do { a=nahodne([-3,-2,2,3]); b=nahodne([-4,-1,1,5]); x=nahodne([-2,2,3]); y=a*x+b; }
      while(new Set([y,a*x-b,a+x+b]).size<3);   // chybné možnosti se nesmí trefit do výsledku
      return { otazka:`Jaká je hodnota funkce <b>y = ${a}x ${b<0?'−':'+'} ${Math.abs(b)}</b> pro <b>x = ${x}</b>?`,
        moznosti:[moznost(`${y}`,true),
          moznost(`${a*x-b}`,false,'Pozor na znaménko u b – přičítá se, jak je v předpisu.'),
          moznost(`${a+x+b}`,false,'a se s x násobí: a · x + b.')],
        vysvetleni:`y = ${a} · ${x} ${b<0?'−':'+'} ${Math.abs(b)} = ${y}.` }; },
    ()=>{ const a=nahodne([-3,-0.5,0.5,2]);
      return { otazka:`Je funkce <b>y = ${cis(a,1)}·x + 1</b> rostoucí, nebo klesající?`,
        moznosti:[moznost('rostoucí',a>0,'Rozhoduje znaménko a: kladné a = rostoucí, záporné = klesající.'),
          moznost('klesající',a<0,'Rozhoduje znaménko a: kladné a = rostoucí, záporné = klesající.'),
          moznost('konstantní',false,'Konstantní by byla jen pro a = 0.')],
        vysvetleni:`a = ${cis(a,1)} je ${a>0?'kladné – funkce roste':'záporné – funkce klesá'}.`, poradi:true }; },
    ()=>{ const b=nahodne([-3,4,5]);   // b = 2 by splynulo se sklonem
      return { otazka:`Ve kterém bodě protne přímka <b>y = 2x ${b<0?'−':'+'} ${Math.abs(b)}</b> osu y?`,
        moznosti:[moznost(`[0; ${b}]`,true),
          moznost(`[${b}; 0]`,false,'Na ose y je x = 0. Dosaď: y = 2 · 0 + b = b.'),
          moznost('[0; 2]',false,'2 je sklon. Průsečík s osou y dostaneš pro x = 0: y = b.')],
        vysvetleni:`Pro x = 0 je y = ${b}.` }; },
    ()=>{ const x1=nahodne([0,1]), a=nahodne([2,3,-2]), b=nahodne([1,-1,4]), x2=x1+2;
      const y1=a*x1+b, y2=a*x2+b;
      return { otazka:`Přímka prochází body <b>[${x1}; ${y1}]</b> a <b>[${x2}; ${y2}]</b>. Jaký má sklon a?`,
        moznosti:[moznost(`${a}`,true),
          moznost(`${y2-y1}`,false,'Rozdíl y je potřeba vydělit rozdílem x: a = (y₂ − y₁) / (x₂ − x₁).'),
          moznost(`${cis((x2-x1)/(y2-y1),2)}`,false,'Podíl je obráceně: změna y lomeno změnou x.')],
        vysvetleni:`a = (${y2} − ${y1}) / (${x2} − ${x1}) = ${a}.` }; },
    { otazka:'Kam je otevřená parabola <b>y = −2x² + 1</b>?',
      moznosti:[moznost('Dolů',true),
        moznost('Nahoru',false,'Záporné a (−2) otevírá parabolu dolů – vrchol je nejvyšší bod.'),
        moznost('Doprava',false,'Graf funkce y = ax² + … je otevřený vždy nahoru, nebo dolů.')],
      vysvetleni:'a < 0 → parabola otevřená dolů.' },
    ()=>{ const k=nahodne([1,3,4]), c=nahodne([-2,2,5].filter(c=>c!==k));
      return { otazka:`Kde je vrchol paraboly <b>y = (x − ${k})² ${c<0?'−':'+'} ${Math.abs(c)}</b>?`,
        moznosti:[moznost(`[${k}; ${c}]`,true),
          moznost(`[−${k}; ${c}]`,false,`Výraz v závorce je nula pro x = ${k} – odečtení posouvá doprava.`),
          moznost(`[${c}; ${k}]`,false,'První souřadnice je poloha na ose x (z závorky), druhá svislý posun.')],
        vysvetleni:`(x − ${k})² je nejmenší (nula) pro x = ${k}, a pak y = ${c}.` }; },
    { otazka:'Proč funkce <b>y = 2/x</b> nemá hodnotu pro x = 0?',
      moznosti:[moznost('Nulou se dělit nedá.',true),
        moznost('Pro x = 0 je y = 0.',false,'2 / 0 není 0 – dělení nulou není definované, graf má v x = 0 mezeru.'),
        moznost('Pro x = 0 je y = 2.',false,'2 / 0 není definováno. Hodnota y roste nade všechny meze, čím blíž je x k nule.')],
      vysvetleni:'Hyperbola se ose y jen přibližuje, nikdy ji neprotne.' },
    { otazka:'Kterým bodem prochází graf každé exponenciální funkce <b>y = aˣ</b>?',
      moznosti:[moznost('[0; 1]',true),
        moznost('[0; 0]',false,'a⁰ = 1 pro každé a > 0 – graf prochází bodem [0; 1].'),
        moznost('[1; 0]',false,'Pro x = 1 je y = a. Společný bod je [0; 1].')],
      vysvetleni:'Každé číslo na nultou je 1.' },
  ],
});
})();
</script>
