<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slovní úlohy a úsudek</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../kostra.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .zadani-ulohy { max-width: 580px; font-size: 1.1rem; line-height: 1.6; }
    .zadani-ulohy b { color: var(--accent); }
    .napovedy { color: var(--text-faint); font-size: 0.85rem; max-width: 520px; }
    .scena-ulohy { margin: 0 0 14px; max-width: 580px; }
    .scena-ulohy img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 14px; background: #f4edda; box-shadow: 0 5px 18px #0002; }
    .scena-ulohy figcaption { margin-top: 6px; color: var(--text-faint); font-size: .82rem; text-align: center; }
  </style>
</head>
<body>
  <h1>🧠 Slovní úlohy a úsudek</h1>
  <p class="podtitul">Pro 5.–6. ročník: úlohy o více krocích, odhad a hledání správného postupu.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="vyres" class="active">🧮 Vyřeš úlohu</button>
    <button data-rezim="prvniKrok">1️⃣ Co spočítat nejdřív</button>
    <button data-rezim="odhad">🎯 Odhadni výsledek</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Postup u slovní úlohy: <b>přečti</b> zadání, <b>zapiš</b> si údaje, <b>rozmysli</b> co počítat
    jako první, <b>spočítej</b> a nakonec <b>ověř</b>, jestli výsledek dává smysl.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('metodus_m5_slovni', $('skore'));
let rezim = 'vyres';

/* Šest prostředí odpovídá šesti ilustracím IMG-m-04. Čísla zůstávají živá ve webu. */
const SABLONY = [
  () => {
    const cena = Uloha.nahodneCislo(12, 45), kusu = Uloha.nahodneCislo(3, 9);
    const platil = Math.ceil((cena * kusu + Uloha.nahodneCislo(10, 90)) / 50) * 50;
    return {
      text: `Sešit stojí <b>${cena} Kč</b>. Maminka koupila <b>${kusu}</b> sešitů a platila
             bankovkou <b>${platil} Kč</b>. Kolik korun dostane nazpátek?`,
      scena: 'obchod', alt: 'Maminka s dítětem platí za sešity v papírnictví.', popisek: 'Nákup v papírnictví',
      vysledek: platil - cena * kusu, jednotka: 'Kč',
      prvni: `${cena} × ${kusu}`,
      spatnePrvni: [`${platil} − ${cena}`, `${platil} : ${kusu}`, `${platil} + ${cena}`],
    };
  },
  () => {
    const vagony = Uloha.nahodneCislo(3, 7), vagon = Uloha.nahodneCislo(24, 48);
    return {
      text: `Výletní vlak má <b>${vagony}</b> vagonů a v každém je <b>${vagon}</b> míst.
             Kolik cestujících se do vlaku vejde?`,
      scena: 'vlak', alt: 'Skupina žáků s učiteli čeká u vlaku na nástupišti.', popisek: 'Školní výlet vlakem',
      vysledek: vagony * vagon, jednotka: 'cestujících',
      prvni: `${vagony} × ${vagon}`,
      spatnePrvni: [`${vagon} : ${vagony}`, `${vagon} − ${vagony}`, `${vagon} + ${vagony}`],
    };
  },
  () => {
    const zahony = Uloha.nahodneCislo(3, 8), sazenic = Uloha.nahodneCislo(6, 12);
    return {
      text: `Na školní zahradě je <b>${zahony}</b> záhonů. Do každého děti zasadí <b>${sazenic}</b> sazenic.
             Kolik sazenic potřebují celkem?`,
      scena: 'zahrada', alt: 'Děti sázejí a zalévají zeleninu ve školní zahradě.', popisek: 'Práce na školní zahradě',
      vysledek: zahony * sazenic, jednotka: 'sazenic',
      prvni: `${zahony} × ${sazenic}`,
      spatnePrvni: [`${sazenic} : ${zahony}`, `${sazenic} + ${zahony}`, `${sazenic} − ${zahony}`],
    };
  },
  () => {
    const porci = Uloha.nahodneCislo(80, 140), vydano = Uloha.nahodneCislo(35, 75);
    return {
      text: `Školní jídelna připravila <b>${porci}</b> porcí. O první přestávce vydala <b>${vydano}</b> porcí.
             Kolik porcí ještě zbývá?`,
      scena: 'jidelna', alt: 'Žáci si berou oběd u výdejního pultu školní jídelny.', popisek: 'Oběd ve školní jídelně',
      vysledek: porci - vydano, jednotka: 'porcí',
      prvni: `${porci} − ${vydano}`,
      spatnePrvni: [`${porci} + ${vydano}`, `${porci} : ${vydano}`, `${vydano} × 2`],
    };
  },
  () => {
    const krabice = Uloha.nahodneCislo(3, 6), kusu = Uloha.nahodneCislo(7, 14), navic = Uloha.nahodneCislo(2, 8);
    return {
      text: `Ve sbírce je <b>${krabice}</b> krabic po <b>${kusu}</b> kamíncích a ještě <b>${navic}</b> kamínků leží vedle.
             Kolik kamínků je ve sbírce celkem?`,
      scena: 'sbirka', alt: 'Dívka třídí kamínky, mušle a další přírodniny do krabic.', popisek: 'Třídění sbírky',
      vysledek: krabice * kusu + navic, jednotka: 'kamínků',
      prvni: `${krabice} × ${kusu}`,
      spatnePrvni: [`${krabice} + ${kusu}`, `${kusu} − ${navic}`, `${kusu} : ${krabice}`],
    };
  },
  () => {
    const dopoledne = Uloha.nahodneCislo(18, 36), odpoledne = Uloha.nahodneCislo(12, 28);
    return {
      text: `Cyklisté ujeli dopoledne <b>${dopoledne} km</b> a odpoledne <b>${odpoledne} km</b>.
             Kolik kilometrů ujeli za celý den?`,
      scena: 'cyklo', alt: 'Děti s učitelem odpočívají s koly u venkovské cyklostezky.', popisek: 'Výlet na kolech',
      vysledek: dopoledne + odpoledne, jednotka: 'km',
      prvni: `${dopoledne} + ${odpoledne}`,
      spatnePrvni: [`${dopoledne} − ${odpoledne}`, `${dopoledne} × ${odpoledne}`, `${dopoledne} : ${odpoledne}`],
    };
  },
];

const novaUlohaData = () => Uloha.nahodne(SABLONY)();

const kartaUlohy = u => `<div class="karta">
  <figure class="scena-ulohy"><picture>
    <source srcset="img/m/m5-slovni-${u.scena}.webp" type="image/webp">
    <img src="img/m/m5-slovni-${u.scena}.png" alt="${u.alt}" width="1536" height="1024">
  </picture><figcaption>${u.popisek} – potřebná čísla najdeš v zadání.</figcaption></figure>
  <div class="zadani-ulohy">${u.text}</div></div>`;

function moznostiKolem(spravny, jednotka) {
  const jine = new Set();
  let pojistka = 0;
  while (jine.size < 3 && pojistka++ < 60) {
    const k = spravny + Uloha.nahodne([-100, -10, -5, -2, -1, 1, 2, 5, 10, 100]);
    if (k !== spravny && k > 0) jine.add(k);
  }
  return Uloha.zamichej([spravny, ...jine]).map(v => ({ klic: String(v), popis: v + ' ' + jednotka }));
}

/* ---- Vyřeš úlohu ---------------------------------------------------------------- */
function vyres() {
  const p = $('plocha');
  const u = novaUlohaData();
  p.innerHTML = `<div class="zadani">Vyřeš slovní úlohu:</div>${kartaUlohy(u)}`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: moznostiKolem(u.vysledek, u.jednotka),
    spravnyKlic: String(u.vysledek),
    zpravaOk: `✅ Správně – ${u.vysledek} ${u.jednotka}. První krok byl ${u.prvni}.`,
    zpravaChyba: `Zkus si zapsat údaje a začni výpočtem ${u.prvni}.`,
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Co spočítat nejdřív -------------------------------------------------------- */
function prvniKrok() {
  const p = $('plocha');
  const u = novaUlohaData();
  p.innerHTML = `<div class="zadani">Který výpočet uděláš jako <b>první</b>?</div>${kartaUlohy(u)}`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.prvni, ...u.spatnePrvni]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.prvni,
    zpravaOk: `✅ Ano, začneme výpočtem ${u.prvni}. Výsledek celé úlohy je ${u.vysledek} ${u.jednotka}.`,
    zpravaChyba: 'Rozmysli si, co potřebuješ vědět dřív, než dopočítáš odpověď.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Odhadni výsledek ------------------------------------------------------------ */
function odhad() {
  const p = $('plocha');
  const u = novaUlohaData();
  const rad = u.vysledek < 100 ? 10 : u.vysledek < 1000 ? 100 : 1000;
  const spravny = Math.round(u.vysledek / rad) * rad;
  const jine = [spravny + rad, spravny - rad, spravny + 2 * rad]
    .filter(x => x > 0 && x !== spravny);

  p.innerHTML = `<div class="zadani">Odhadni, kolik zhruba vyjde – bez přesného počítání.</div>
    ${kartaUlohy(u)}
    <div class="napovedy">Zaokrouhli si čísla a počítej zpaměti.</div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([spravny, ...jine.slice(0, 3)])
      .map(v => ({ klic: String(v), popis: 'asi ' + v + ' ' + u.jednotka })),
    spravnyKlic: String(spravny),
    zpravaOk: `✅ Přesný výsledek je ${u.vysledek} ${u.jednotka}, takže odhad ${spravny} sedí.`,
    zpravaChyba: 'Zaokrouhli čísla v zadání a zkus to znovu.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { vyres, prvniKrok, odhad };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
