<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domácí a volně žijící zvířata</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../kostra.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .zvire-nazev { font-size: 1.3rem; font-weight: 700; }
    .dvojice { display: flex; align-items: center; gap: 16px; justify-content: center; }
    .dvojice .sipka { font-size: 1.6rem; color: var(--text-faint); }
    .zvire-obrazek { width: min(250px, 58vw); aspect-ratio: 1; object-fit: contain; border-radius: 16px; background: #f8f1e5; }
    .moznosti .ikona:has(.mlade-volba) { width: min(132px, 31vw); height: auto; }
    .mlade-volba { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 12px; background: #f8f1e5; display: block; }
  </style>
</head>
<body>
  <h1>🐄 Domácí a volně žijící zvířata</h1>
  <p class="podtitul">Pro 2.–3. ročník: kdo žije u lidí, kdo ve volné přírodě, jejich mláďata a příbytky.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="kdeZije" class="active">🏡 Domácí, nebo volně žijící?</button>
    <button data-rezim="mladata">🐣 Mláďata</button>
    <button data-rezim="pribytky">🏠 Kde bydlí</button>
    <button data-rezim="uzitek">🥚 K čemu je chováme</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    <b>Domácí zvířata</b> chová člověk – dává jim krmení a přístřeší, ona mu dávají užitek nebo
    společnost. <b>Volně žijící zvířata</b> se o sebe starají sama a potravu si hledají v přírodě.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('metodus_prv2_zvirata', $('skore'));
let rezim = 'kdeZije';

/* zvíře, emoji, domácí?, mládě, příbytek, užitek (jen u domácích) */
const ZVIRATA = [
  { n:'kráva', img:'aj/aj-slovicka-cow.webp', domaci:true, mlade:'tele', mladeImg:'prv/prv2-mlade-tele.webp', dum:'chlév', uzitek:'mléko' },
  { n:'prase', img:'aj/aj-slovicka-pig.webp', domaci:true, mlade:'sele', mladeImg:'prv/prv2-mlade-sele.webp', dum:'chlívek', uzitek:'maso' },
  { n:'koza', img:'prv/prv2-zvire-koza.webp', domaci:true, mlade:'kůzle', mladeImg:'prv/prv2-mlade-kuzle.webp', dum:'chlév', uzitek:'mléko' },
  { n:'ovce', img:'prv/prv2-zvire-ovce.webp', domaci:true, mlade:'jehně', mladeImg:'prv/prv2-mlade-jehne.webp', dum:'ovčín', uzitek:'vlna' },
  { n:'kůň', img:'aj/aj-slovicka-horse.webp', domaci:true, mlade:'hříbě', mladeImg:'prv/prv2-mlade-hribe.webp', dum:'stáj', uzitek:'práce a jízda' },
  { n:'slepice', img:'cj/cj1-pismena-slepice.webp', domaci:true, mlade:'kuře', mladeImg:'prv/prv2-mlade-kure.webp', dum:'kurník', uzitek:'vejce' },
  { n:'husa', img:'prv/prv2-zvire-husa.webp', domaci:true, mlade:'house', mladeImg:'prv/prv2-mlade-house.webp', dum:'husník', uzitek:'peří' },
  { n:'kachna', img:'prv/prv2-zvire-kachna.webp', domaci:true, mlade:'káče', mladeImg:'prv/prv2-mlade-kace.webp', dum:'kachní výběh', uzitek:'maso' },
  { n:'králík', img:'aj/aj-slovicka-rabbit.webp', domaci:true, mlade:'králíče', mladeImg:'prv/prv2-mlade-kralice.webp', dum:'králíkárna', uzitek:'maso' },
  { n:'pes', img:'aj/aj-slovicka-dog.webp', domaci:true, mlade:'štěně', mladeImg:'prv/prv2-mlade-stene.webp', dum:'bouda', uzitek:'hlídání' },
  { n:'kočka', img:'aj/aj-slovicka-cat.webp', domaci:true, mlade:'kotě', mladeImg:'prv/prv2-mlade-kote.webp', dum:'dům', uzitek:'chytání myší' },
  { n:'morče', img:'prv/prv2-zvire-morce.webp', domaci:true, mlade:'mládě morčete', mladeImg:'prv/prv2-mlade-morce.webp', dum:'klec', uzitek:'společnost' },
  { n:'osel', img:'prv/prv2-zvire-osel.webp', domaci:true, mlade:'oslátko', dum:'stáj', uzitek:'práce a nošení nákladu' },
  { n:'krůta', img:'prv/prv2-zvire-kruta.webp', domaci:true, mlade:'krůtě', dum:'krůtník', uzitek:'maso' },
  { n:'včela', img:'cj/cj1-pismena-vcela.webp', domaci:true, mlade:'larva', dum:'úl', uzitek:'med' },
  { n:'liška', img:'aj/aj-slovicka-fox.webp', domaci:false, mlade:'lišče', dum:'nora' },
  { n:'srna', img:'prv/prv2-zvire-srna.webp', domaci:false, mlade:'srnče', dum:'les' },
  { n:'zajíc', img:'prv/prv2-zvire-zajic.webp', domaci:false, mlade:'zajíče', dum:'pelech v poli' },
  { n:'ježek', img:'prv/prv2-zvire-jezek.webp', domaci:false, mlade:'ježče', dum:'hnízdo z listí' },
  { n:'veverka', img:'prv/prv2-zvire-veverka.webp', domaci:false, mlade:'veverče', dum:'dutina stromu' },
  { n:'divoké prase', img:'prv/prv2-zvire-divocak.webp', domaci:false, mlade:'sele', dum:'les' },
  { n:'jezevec', img:'prv/prv2-zvire-jezevec.webp', domaci:false, mlade:'jezevče', dum:'nora' },
  { n:'sova', img:'prv/prv2-zvire-sova.webp', domaci:false, mlade:'sůvě', dum:'dutina stromu' },
  { n:'datel', img:'prv/prv2-zvire-datel.webp', domaci:false, mlade:'mládě datla', dum:'dutina stromu' },
  { n:'čáp', img:'prv/prv2-zvire-cap.webp', domaci:false, mlade:'čápě', dum:'hnízdo na komíně' },
  { n:'žába', img:'cj/cj1-pismena-zaba.webp', domaci:false, mlade:'pulec', dum:'rybník' },
  { n:'ropucha', img:'prv/prv2-zvire-ropucha.webp', domaci:false, mlade:'pulec', dum:'vlhké místo' },
  { n:'užovka', img:'prv/prv2-zvire-uzovka.webp', domaci:false, mlade:'mládě užovky', dum:'břeh rybníka' },
  { n:'vydra', img:'cj/vyjmenovana-v-vydra.webp', domaci:false, mlade:'vydří mládě', dum:'nora u vody' },
  { n:'bobr', img:'prv/prv2-zvire-bobr.webp', domaci:false, mlade:'bobří mládě', dum:'hrad u vody' },
];

const obrazekZvirete = z => `<img class="zvire-obrazek" src="img/${z.img}" alt="${z.n}" width="768" height="768">`;
const obrazekMladete = z => `<img class="mlade-volba" src="img/${z.mladeImg}" alt="${z.mlade}" width="640" height="640">`;

const DOMACI = ZVIRATA.filter(z => z.domaci);
const MLADATA = ZVIRATA.filter(z => z.mladeImg);

/* ---- Domácí, nebo volně žijící? ------------------------------------------ */
function kdeZije() {
  const p = $('plocha');
  const z = Uloha.nahodne(ZVIRATA);
  p.innerHTML = `<div class="zadani">Je to zvíře domácí, nebo volně žijící?</div>
    <div class="karta">${obrazekZvirete(z)}<div class="zvire-nazev">${z.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'dve',
    moznosti: [
      { klic: 'domaci', ikona: '🏡', popis: 'domácí' },
      { klic: 'volne', ikona: '🌲', popis: 'volně žijící' },
    ],
    spravnyKlic: z.domaci ? 'domaci' : 'volne',
    zpravaOk: z.domaci
      ? `✅ Ano, ${z.n} chová člověk – bydlí v místě zvaném ${z.dum}.`
      : `✅ Ano, ${z.n} žije volně v přírodě – najdeš ji tam, kde je ${z.dum}.`,
    zpravaChyba: 'Zkus druhou možnost – stará se o toto zvíře člověk?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Mláďata --------------------------------------------------------------- */
function mladata() {
  const p = $('plocha');
  const z = Uloha.nahodne(MLADATA);
  const jina = Uloha.zamichej(MLADATA.filter(x => x.mlade !== z.mlade)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Které mládě patří k tomuto dospělému zvířeti?</div>
    <div class="karta">${obrazekZvirete(z)}<div class="zvire-nazev">${z.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([z, ...jina]).map(x => ({ klic: x.mlade, ikona: obrazekMladete(x), popis: x.mlade })),
    spravnyKlic: z.mlade,
    zpravaOk: `✅ Mládě zvířete ${z.n} je ${z.mlade}.`,
    zpravaChyba: 'To je mládě jiného zvířete – zkus to znovu.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Kde bydlí ------------------------------------------------------------ */
function pribytky() {
  const p = $('plocha');
  const z = Uloha.nahodne(ZVIRATA);
  const jina = Uloha.zamichej(ZVIRATA.filter(x => x.dum !== z.dum)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Kde toto zvíře bydlí?</div>
    <div class="karta">${obrazekZvirete(z)}<div class="zvire-nazev">${z.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([z, ...jina]).map(x => ({ klic: x.dum, popis: x.dum })),
    spravnyKlic: z.dum,
    zpravaOk: `✅ ${z.n[0].toUpperCase() + z.n.slice(1)} bydlí tam, kde je ${z.dum}.`,
    zpravaChyba: 'Tam bydlí jiné zvíře – zkus to znovu.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- K čemu je chováme ---------------------------------------------------- */
function uzitek() {
  const p = $('plocha');
  const z = Uloha.nahodne(DOMACI);
  const jina = Uloha.zamichej(DOMACI.filter(x => x.uzitek !== z.uzitek)).slice(0, 3);
  p.innerHTML = `<div class="zadani">Proč lidé toto zvíře chovají?</div>
    <div class="karta">${obrazekZvirete(z)}<div class="zvire-nazev">${z.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([z, ...jina]).map(x => ({ klic: x.uzitek, popis: x.uzitek })),
    spravnyKlic: z.uzitek,
    zpravaOk: `✅ Od zvířete ${z.n} máme ${z.uzitek}.`,
    zpravaChyba: 'To dává jiné zvíře – zkus to znovu.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { kdeZije, mladata, pribytky, uzitek };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
