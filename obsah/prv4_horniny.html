<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horniny a nerosty</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../kostra.js" defer></script>
  <script src="../data/horniny.js"></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .nazev-h { font-size: 1.3rem; font-weight: 700; }
    .popis-h { max-width: 520px; font-size: 1rem; line-height: 1.5; color: var(--text-muted); }
    .vlastnosti { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .vlastnosti span {
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 20px;
      padding: 5px 12px; font-size: 0.82rem; color: var(--text-muted);
    }
  </style>
</head>
<body>
  <h1>🪨 Horniny a nerosty</h1>
  <p class="podtitul">Pro 4.–5. ročník: poznávání podle vlastností, rozdíl mezi horninou a nerostem, využití.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="poznej" class="active">🔍 Poznej podle popisu</button>
    <button data-rezim="druh">🗂️ Hornina, či nerost?</button>
    <button data-rezim="vyuziti">🏗️ K čemu se používá</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    <b>Nerost</b> (minerál) je stejnorodá přírodnina – celý kus má stejné složení (sůl, křemen, zlato).
    <b>Hornina</b> je směs více nerostů (žula, pískovec, vápenec).
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('metodus_prv4_horniny', $('skore'));
let rezim = 'poznej';

// Vzorky jsou společná data rodiny „Horniny a stavba Země" (data/horniny.js).
const VZORKY = METODUS_HORNINY;

/* ---- Poznej podle popisu ------------------------------------------------------ */
function poznej() {
  const p = $('plocha');
  const u = Uloha.nahodne(VZORKY);
  const jine = Uloha.zamichej(VZORKY.filter(x => x.n !== u.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">O kterou přírodninu jde?</div>
    <div class="karta"><div class="obrazek">🔎</div>
    <div class="popis-h">${u.popis}</div></div>`;
  const vl = document.createElement('div');
  vl.className = 'vlastnosti';
  vl.innerHTML = u.vlastnosti.map(v => `<span>${v}</span>`).join('');
  p.appendChild(vl);

  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.n, ikona: x.e, popis: x.n })),
    spravnyKlic: u.n,
    zpravaOk: `✅ ${u.n} – ${u.vlastnosti.join(', ')}.`,
    zpravaChyba: 'Přečti si popis ještě jednou – které vlastnosti sedí?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Hornina, či nerost? ------------------------------------------------------ */
function druh() {
  const p = $('plocha');
  const u = Uloha.nahodne(VZORKY);
  p.innerHTML = `<div class="zadani">Je to hornina, nebo nerost?</div>
    <div class="karta"><div class="obrazek">${u.e}</div><div class="nazev-h">${u.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'dve',
    moznosti: [
      { klic: 'hornina', ikona: '🪨', popis: 'hornina (směs nerostů)' },
      { klic: 'nerost', ikona: '💎', popis: 'nerost (stejnorodý)' },
    ],
    spravnyKlic: u.hornina ? 'hornina' : 'nerost',
    zpravaOk: u.hornina
      ? `✅ ${u.n} je hornina – je složená z více nerostů.`
      : `✅ ${u.n} je nerost – celý kus má stejné složení.`,
    zpravaChyba: 'Zkus druhou možnost – jde o směs, nebo stejnorodou látku?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- K čemu se používá -------------------------------------------------------- */
function vyuziti() {
  const p = $('plocha');
  const u = Uloha.nahodne(VZORKY);
  const jine = Uloha.zamichej(VZORKY.filter(x => x.vyuziti !== u.vyuziti)).slice(0, 3);
  p.innerHTML = `<div class="zadani">K čemu se používá?</div>
    <div class="karta"><div class="obrazek">${u.e}</div><div class="nazev-h">${u.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.vyuziti, popis: x.vyuziti })),
    spravnyKlic: u.vyuziti,
    zpravaOk: `✅ ${u.n} se používá na ${u.vyuziti}.`,
    zpravaChyba: 'To je využití jiné přírodniny.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { poznej, druh, vyuziti };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
