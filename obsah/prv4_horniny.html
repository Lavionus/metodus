<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horniny a nerosty</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../kostra.js" defer></script>
  <script src="../data/horniny.js"></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .nazev-h { font-size: 1.3rem; font-weight: 700; }
    .popis-h { max-width: 520px; font-size: 1rem; line-height: 1.5; color: var(--text-muted); }
    .vlastnosti { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .vlastnosti span {
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 20px;
      padding: 5px 12px; font-size: 0.82rem; color: var(--text-muted);
    }
    .foto-vzorek { display:block; width:min(380px,82vw); height:auto; aspect-ratio:4/3; object-fit:contain;
      background:#1d1c1a; border:1px solid var(--border); border-radius:14px; }
    .karta .foto-mala { display:block; width:min(220px,60vw); height:auto; aspect-ratio:4/3; object-fit:contain;
      background:#1d1c1a; border-radius:10px; margin:0 auto 6px; }
    .foto-atlas { width:min(1120px,100%); margin:22px auto; }
    .foto-atlas h2 { margin:0 0 5px; text-align:center; font-size:1.22rem; }
    .foto-atlas > p { margin:0 auto 12px; max-width:820px; text-align:center; color:var(--text-muted,var(--text)); }
    .foto-atlas h3 { margin:16px 0 8px; font-size:1.02rem; }
    .foto-mrizka { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .foto-karta { margin:0; overflow:hidden; border:1px solid var(--border); border-radius:14px; background:var(--bg-card); box-shadow:var(--shadow-sm); }
    .foto-karta img { display:block; width:100%; height:auto; aspect-ratio:4/3; object-fit:cover; }
    .foto-karta img.cele { object-fit:contain; background:#1d1c1a; }
    .foto-karta figcaption { padding:10px 11px 12px; font-size:.9rem; line-height:1.35; }
    .foto-karta strong { display:block; margin-bottom:3px; color:var(--accent); font-size:1rem; }
    @media (max-width:820px) { .foto-mrizka { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:440px) { .foto-mrizka { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <h1>🪨 Horniny a nerosty</h1>
  <p class="podtitul">Pro 4.–5. ročník: poznávání podle vlastností, rozdíl mezi horninou a nerostem, využití.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="foto" class="active">📷 Poznej na fotografii</button>
    <button data-rezim="poznej">🔍 Poznej podle popisu</button>
    <button data-rezim="druh">🗂️ Hornina, či nerost?</button>
    <button data-rezim="vyuziti">🏗️ K čemu se používá</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    <b>Nerost</b> (minerál) je stejnorodá přírodnina – celý kus má stejné složení (sůl, křemen, zlato).
    <b>Hornina</b> je směs více nerostů (žula, pískovec, vápenec).
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('metodus_prv4_horniny', $('skore'));
let rezim = 'foto';

// Vzorky jsou společná data rodiny „Horniny a stavba Země" (data/horniny.js).
const VZORKY = METODUS_HORNINY;

/* Fotografie vzorků (IMG-prv-17, Wikimedia Commons; autoři a licence v seznamu zdrojů pod stránkou).
   Klíč = název vzorku. [soubor ve složce img/prv, šířka, výška, alt] */
const FOTO = {
/*FOTO*/
};
const fotoSrc = n => `img/prv/${FOTO[n][0]}.webp`;
/* Vzorky, které nejsou ve společných datech, ale patří do poznávačky podle fotografií. */
const DOPLNKY = [
  { n: 'břidlice', hornina: true, znak: 'tmavá, štípe se na tenké rovné desky' },
  { n: 'mramor', hornina: true, znak: 'vznikl přeměnou vápence, dá se leštit' },
  { n: 'živec', hornina: false, znak: 'světlý nebo růžový, s rovnými lesklými plochami' },
  { n: 'kalcit', hornina: false, znak: 'průsvitný, šumí s octem' },
  { n: 'sádrovec', hornina: false, znak: 'tak měkký, že do něj rýpneš nehtem' },
  { n: 'pyrit', hornina: false, znak: 'mosazně žluté kovově lesklé krychličky – „kočičí zlato“' },
  { n: 'magnetit', hornina: false, znak: 'černý, přitahuje ho magnet' },
];
const VSECHNY = [...VZORKY.map(v => ({ n: v.n, hornina: v.hornina, znak: v.vlastnosti.join(', ') })), ...DOPLNKY];
const S_FOTKOU = VSECHNY.filter(v => FOTO[v.n]);
function obr(u) {
  if (!FOTO[u.n]) return `<div class="obrazek">${u.e || '🪨'}</div>`;
  const [, w, h, alt] = FOTO[u.n];
  return `<img class="foto-mala" src="${fotoSrc(u.n)}" alt="${alt}" width="${w}" height="${h}">`;
}

/* ---- Poznej na fotografii ----------------------------------------------------- */
function foto() {
  const p = $('plocha');
  const u = Uloha.nahodne(S_FOTKOU);
  const jine = Uloha.zamichej(S_FOTKOU.filter(x => x.n !== u.n)).slice(0, 3);
  const [, w, h, alt] = FOTO[u.n];
  p.innerHTML = `<div class="zadani">Který vzorek je na fotografii?</div>
    <img class="foto-vzorek" src="${fotoSrc(u.n)}" alt="Neznámý vzorek k poznání." width="${w}" height="${h}">`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.n, popis: x.n })),
    spravnyKlic: u.n,
    zpravaOk: `✅ ${u.n} (${u.hornina ? 'hornina' : 'nerost'}) – ${u.znak}.`,
    zpravaChyba: 'Podívej se na barvu, lesk a na to, jestli je vzorek zrnitý, nebo stejnorodý.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Poznej podle popisu ------------------------------------------------------ */
function poznej() {
  const p = $('plocha');
  const u = Uloha.nahodne(VZORKY);
  const jine = Uloha.zamichej(VZORKY.filter(x => x.n !== u.n)).slice(0, 3);
  p.innerHTML = `<div class="zadani">O kterou přírodninu jde?</div>
    <div class="karta"><div class="obrazek">🔎</div>
    <div class="popis-h">${u.popis}</div></div>`;
  const vl = document.createElement('div');
  vl.className = 'vlastnosti';
  vl.innerHTML = u.vlastnosti.map(v => `<span>${v}</span>`).join('');
  p.appendChild(vl);

  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.n, ikona: x.e, popis: x.n })),
    spravnyKlic: u.n,
    zpravaOk: `✅ ${u.n} – ${u.vlastnosti.join(', ')}.`,
    zpravaChyba: 'Přečti si popis ještě jednou – které vlastnosti sedí?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Hornina, či nerost? ------------------------------------------------------ */
function druh() {
  const p = $('plocha');
  const u = Uloha.nahodne([...VZORKY, ...DOPLNKY.filter(v => FOTO[v.n])]);
  p.innerHTML = `<div class="zadani">Je to hornina, nebo nerost?</div>
    <div class="karta">${obr(u)}<div class="nazev-h">${u.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'dve',
    moznosti: [
      { klic: 'hornina', ikona: '🪨', popis: 'hornina (směs nerostů)' },
      { klic: 'nerost', ikona: '💎', popis: 'nerost (stejnorodý)' },
    ],
    spravnyKlic: u.hornina ? 'hornina' : 'nerost',
    zpravaOk: u.hornina
      ? `✅ ${u.n} je hornina – je složená z více nerostů.`
      : `✅ ${u.n} je nerost – celý kus má stejné složení.`,
    zpravaChyba: 'Zkus druhou možnost – jde o směs, nebo stejnorodou látku?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- K čemu se používá -------------------------------------------------------- */
function vyuziti() {
  const p = $('plocha');
  const u = Uloha.nahodne(VZORKY);
  const jine = Uloha.zamichej(VZORKY.filter(x => x.vyuziti !== u.vyuziti)).slice(0, 3);
  p.innerHTML = `<div class="zadani">K čemu se používá?</div>
    <div class="karta">${obr(u)}<div class="nazev-h">${u.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u, ...jine]).map(x => ({ klic: x.vyuziti, popis: x.vyuziti })),
    spravnyKlic: u.vyuziti,
    zpravaOk: `✅ ${u.n} se používá na ${u.vyuziti}.`,
    zpravaChyba: 'To je využití jiné přírodniny.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { foto, poznej, druh, vyuziti };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
