<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zdravý životní styl</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="../vyuka.css">
  <script src="../theme.js"></script>
  <script src="../podpis.js" defer></script>
  <script src="../kostra.js" defer></script>
  <script src="../rec.js"></script>
  <script src="../uloha.js"></script>
  <style>
    .nazev-p { font-size: 1.2rem; font-weight: 700; }
    .pyramida { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .pyramida div {
      background: var(--bg-elevated); border: 2px solid var(--border); border-radius: 6px;
      padding: 6px 10px; font-size: 0.85rem; color: var(--text-muted); text-align: center;
    }
    .pyramida div:nth-child(1) { width: 44%; }
    .pyramida div:nth-child(2) { width: 58%; }
    .pyramida div:nth-child(3) { width: 72%; }
    .pyramida div:nth-child(4) { width: 86%; }
    .pyramida div:nth-child(5) { width: 100%; }
    .rezim-den { color: var(--text-muted); max-width: 520px; font-size: 1rem; line-height: 1.5; }
    .potravina-obrazek { width: min(100%, 320px); aspect-ratio: 1; object-fit: cover; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 8px 22px #0002; }
    .moznosti .ikona:has(.volba-jidlo) { width: min(145px, 32vw); height: auto; }
    .volba-jidlo { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 1px solid var(--border); display: block; }
  </style>
</head>
<body>
  <h1>🥗 Zdravý životní styl</h1>
  <p class="podtitul">Pro 5. ročník: pestrá strava, pohyb, spánek a péče o sebe.</p>

  <div class="rezimy" id="rezimy">
    <button data-rezim="pyramida" class="active">🔺 Potravinová pyramida</button>
    <button data-rezim="volba">⚖️ Co je zdravější?</button>
    <button data-rezim="rezimDne">🕐 Režim dne</button>
    <button data-rezim="mytus">❓ Pravda, nebo mýtus</button>
  </div>

  <div class="plocha" id="plocha"></div>

  <div class="ovladani">
    <button class="hlavni" id="btnDalsi">Přeskočit →</button>
    <span class="skore" id="skore"></span>
  </div>

  <p class="napoveda">
    Základ pyramidy tvoří <b>obiloviny, zelenina a ovoce</b> – těch jíme nejvíc.
    Nahoře jsou sladkosti a tučná jídla, kterých má být <b>nejméně</b>.
    Dítě potřebuje asi <b>9–10 hodin spánku</b> a aspoň hodinu pohybu denně.
  </p>

<script>
const $ = id => document.getElementById(id);
const skore = Uloha.skore('metodus_prv5_zdravi', $('skore'));
let rezim = 'pyramida';

/* patra pyramidy: 1 = špička (nejméně), 5 = základna (nejvíc) */
const PATRA = {
  5: { nazev: 'obiloviny, pečivo, těstoviny, rýže', popis: 'základ jídelníčku – energie na celý den' },
  4: { nazev: 'zelenina a ovoce', popis: 'několikrát denně – vitamíny a vláknina' },
  3: { nazev: 'mléko, sýry, jogurty', popis: 'denně – vápník pro kosti a zuby' },
  2: { nazev: 'maso, ryby, vejce, luštěniny', popis: 'několikrát týdně – bílkoviny' },
  1: { nazev: 'sladkosti, slazené nápoje a tuky', popis: 'sladkosti jen výjimečně; tuky v malém množství a přednostně rostlinné' },
};

function obrazekJidla(p, trida = 'potravina-obrazek') {
  const png = p.img.replace(/\.webp$/, '.png');
  return `<picture><source srcset="${p.img}" type="image/webp"><img class="${trida}" src="${png}" alt="${p.alt}"></picture>`;
}

const POTRAVINY = [
  { n: 'chléb', patro: 5, img: 'img/aj/aj-slovicka-bread.webp', alt: 'Bochník chleba s ukrojeným krajícem.' },
  { n: 'celozrnná houska', patro: 5, img: 'img/prv/prv5-jidlo-celozrnna-houska.webp', alt: 'Celozrnná houska se semínky.' },
  { n: 'ovesná kaše', patro: 5, img: 'img/prv/prv5-jidlo-ovesna-kase.webp', alt: 'Miska uvařené ovesné kaše.' },
  { n: 'rýže', patro: 5, img: 'img/aj/aj7-mira-miska.webp', alt: 'Miska uvařené rýže.' },
  { n: 'těstoviny', patro: 5, img: 'img/prv/prv5-jidlo-testoviny.webp', alt: 'Miska uvařených těstovin penne.' },
  { n: 'brambora', patro: 5, img: 'img/cj/cj1-pismena-brambora.webp', alt: 'Celá syrová brambora.' },
  { n: 'jablko', patro: 4, img: 'img/aj/aj-slovicka-apple.webp', alt: 'Červené jablko.' },
  { n: 'banán', patro: 4, img: 'img/aj/aj-slovicka-banana.webp', alt: 'Žlutý banán.' },
  { n: 'jahoda', patro: 4, img: 'img/aj/aj-slovicka-strawberry.webp', alt: 'Zralá červená jahoda.' },
  { n: 'mrkev', patro: 4, img: 'img/cj/cj1-pismena-mrkev.webp', alt: 'Celá oranžová mrkev.' },
  { n: 'rajče', patro: 4, img: 'img/prv/prv5-jidlo-rajce.webp', alt: 'Zralé červené rajče.' },
  { n: 'okurka', patro: 4, img: 'img/prv/prv5-jidlo-okurka.webp', alt: 'Celá zelená okurka.' },
  { n: 'brokolice', patro: 4, img: 'img/prv/prv5-jidlo-brokolice.webp', alt: 'Zelená růžice brokolice.' },
  { n: 'pomeranč', patro: 4, img: 'img/prv/prv5-jidlo-pomeranc.webp', alt: 'Celý zralý pomeranč s listem.' },
  { n: 'mléko', patro: 3, img: 'img/aj/aj-slovicka-milk.webp', alt: 'Sklenice mléka.' },
  { n: 'sýr', patro: 3, img: 'img/aj/aj-slovicka-cheese.webp', alt: 'Klínek žlutého sýra.' },
  { n: 'jogurt', patro: 3, img: 'img/prv/prv5-jidlo-jogurt.webp', alt: 'Miska bílého přírodního jogurtu.' },
  { n: 'vejce', patro: 2, img: 'img/aj/aj-slovicka-egg.webp', alt: 'Vařené vejce v kalíšku.' },
  { n: 'ryba', patro: 2, img: 'img/aj/aj-slovicka-fish.webp', alt: 'Ryba jako zdroj bílkovin.' },
  { n: 'kuřecí maso', patro: 2, img: 'img/prv/prv5-jidlo-kureci-maso.webp', alt: 'Grilovaný plátek kuřecího masa.' },
  { n: 'čočka', patro: 2, img: 'img/prv/prv5-jidlo-cocka.webp', alt: 'Miska uvařené hnědé čočky.' },
  { n: 'fazole', patro: 2, img: 'img/prv/prv5-jidlo-fazole.webp', alt: 'Miska uvařených červených fazolí.' },
  { n: 'ořechy', patro: 2, img: 'img/prv/prv5-jidlo-orechy.webp', alt: 'Směs vlašských ořechů, mandlí a lískových ořechů.' },
  { n: 'dort', patro: 1, img: 'img/aj/aj-slovicka-cake.webp', alt: 'Kousek dortu se šlehačkou a jahodou.' },
  { n: 'čokoláda', patro: 1, img: 'img/aj/aj-slovicka-chocolate.webp', alt: 'Tabulka mléčné čokolády.' },
  { n: 'slunečnicový olej', patro: 1, img: 'img/prv/prv5-jidlo-olej.webp', alt: 'Skleněná láhev slunečnicového oleje.' },
  { n: 'máslo', patro: 1, img: 'img/prv/prv5-jidlo-maslo.webp', alt: 'Kostka másla na talířku.' },
  { n: 'chipsy', patro: 1, img: 'img/prv/prv5-jidlo-chipsy.webp', alt: 'Miska bramborových chipsů.' },
  { n: 'sušenka', patro: 1, img: 'img/prv/prv5-jidlo-susenka.webp', alt: 'Kulatá ovesná sušenka.' },
  { n: 'slazená limonáda', patro: 1, img: 'img/aj/aj7-mira-plechovka.webp', alt: 'Neznačková plechovka slazené limonády.' },
];

const VOLBY = [
  { a: { t: 'sklenice vody', img: 'img/aj/aj-slovicka-water.webp', alt: 'Sklenice čisté vody.' }, b: { t: 'slazená limonáda', img: 'img/aj/aj7-mira-plechovka.webp', alt: 'Plechovka slazené limonády.' }, spr: 'a',
    proc: 'Voda hydratuje bez cukru. V půllitru limonády bývá i 10 kostek cukru.' },
  { a: { t: 'jablko', img: 'img/aj/aj-slovicka-apple.webp', alt: 'Červené jablko.' }, b: { t: 'sušenka', img: 'img/prv/prv5-jidlo-susenka.webp', alt: 'Ovesná sušenka.' }, spr: 'a',
    proc: 'Ovoce má vlákninu a vitamíny, sušenka hlavně cukr a tuk.' },
  { a: { t: 'celozrnná houska', img: 'img/prv/prv5-jidlo-celozrnna-houska.webp', alt: 'Celozrnná houska se semínky.' }, b: { t: 'sladký dort', img: 'img/aj/aj-slovicka-cake.webp', alt: 'Kousek sladkého dortu.' }, spr: 'a',
    proc: 'Celozrnné pečivo zasytí na delší dobu a má víc vlákniny.' },
  { a: { t: 'procházka do školy', e: '🚶' }, b: { t: 'cesta autem na 500 metrů', e: '🚗' }, spr: 'a',
    proc: 'Krátká cesta pěšky je pohyb navíc a nic nestojí.' },
  { a: { t: 'spánek 9 hodin', e: '😴' }, b: { t: 'ponocování u mobilu', e: '📱' }, spr: 'a',
    proc: 'Ve spánku se tělo i mozek regenerují a ukládá se to, co ses naučil.' },
  { a: { t: 'ořechy jako svačina', img: 'img/prv/prv5-jidlo-orechy.webp', alt: 'Směs nesolených ořechů.' }, b: { t: 'čokoláda', img: 'img/aj/aj-slovicka-chocolate.webp', alt: 'Tabulka čokolády.' }, spr: 'a',
    proc: 'Ořechy mají zdravé tuky a bílkoviny, tyčinka hlavně cukr.' },
];

const REZIM_DNE = [
  { t: 'Kolik hodin spánku potřebuje desetileté dítě?', spr: '9–10 hodin', jine: ['5–6 hodin', '7 hodin', '12–14 hodin'],
    proc: 'Školák potřebuje devět až deset hodin, aby se dobře soustředil.' },
  { t: 'Kolik minut pohybu denně se doporučuje dětem?', spr: 'aspoň 60 minut', jine: ['10 minut', '5 minut', 'jen o víkendu'],
    proc: 'Hodina pohybu denně posiluje srdce, kosti i náladu.' },
  { t: 'Které jídlo se nemá vynechávat?', spr: 'snídaně', jine: ['oběd o víkendu', 'druhá večeře', 'odpolední svačina'],
    proc: 'Snídaně dodá energii na dopoledne ve škole.' },
  { t: 'Jak často bys měl pít během dne?', spr: 'průběžně, i když nemáš žízeň', jine: ['jen k jídlu', 'jen po sportu', 'jednou za den hodně najednou'],
    proc: 'Tělo potřebuje pít průběžně – žízeň je už signál mírného nedostatku.' },
  { t: 'Kolik času u obrazovky je pro školáka rozumné?', spr: 'nejvýš 1–2 hodiny volného času denně', jine: ['neomezeně', 'jen 5 minut', '6 hodin'],
    proc: 'Dlouhé sezení u obrazovky ubírá čas pohybu a zhoršuje spánek.' },
];

const MYTY = [
  { t: 'Ovoce a zelenina by měly být součástí každého jídla.', pravda: true, proc: 'Doporučuje se pět porcí zeleniny a ovoce denně.' },
  { t: 'Když vynecháš snídani, budeš hubenější.', pravda: false, proc: 'Bez snídaně přichází hlad a přejídání později – tělu chybí energie.' },
  { t: 'Sportovat se dá i doma bez vybavení.', pravda: true, proc: 'Stačí skákání, dřepy, tanec nebo procházka.' },
  { t: 'Energetické nápoje jsou pro děti vhodné.', pravda: false, proc: 'Obsahují hodně kofeinu a cukru – dětem škodí.' },
  { t: 'Po jídle je dobré vyčistit si zuby.', pravda: true, proc: 'Zuby si čistíme dvakrát denně, ideálně po jídle.' },
  { t: 'Když jíš jen jednu potravinu, je to zdravé.', pravda: false, proc: 'Tělo potřebuje pestrou stravu – žádná potravina nemá všechno.' },
];

/* ---- Potravinová pyramida --------------------------------------------------------- */
function pyramida() {
  const p = $('plocha');
  const u = Uloha.nahodne(POTRAVINY);
  p.innerHTML = `<div class="zadani">Do kterého patra pyramidy patří?</div>
    <div class="karta"><div class="obrazek">${obrazekJidla(u)}</div><div class="nazev-p">${u.n}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej(Object.entries(PATRA))
      .map(([klic, x]) => ({ klic, popis: x.nazev })),
    spravnyKlic: String(u.patro),
    zpravaOk: `✅ ${u.n} – ${PATRA[u.patro].popis}.`,
    zpravaChyba: 'Rozmysli si, jestli se toho má jíst hodně (základ), nebo málo (špička).',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Co je zdravější? -------------------------------------------------------------- */
function volba() {
  const p = $('plocha');
  const u = Uloha.nahodne(VOLBY);
  p.innerHTML = '<div class="zadani">Co je pro tělo lepší?</div>';
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'dve',
    moznosti: Uloha.zamichej([
      { klic: 'a', ikona: u.a.img ? obrazekJidla(u.a, 'volba-jidlo') : u.a.e, popis: u.a.t },
      { klic: 'b', ikona: u.b.img ? obrazekJidla(u.b, 'volba-jidlo') : u.b.e, popis: u.b.t },
    ]),
    spravnyKlic: u.spr,
    zpravaOk: '✅ ' + u.proc,
    zpravaChyba: 'Zkus druhou možnost – co tělu dodá víc než jen cukr?',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Režim dne ---------------------------------------------------------------------- */
function rezimDne() {
  const p = $('plocha');
  const u = Uloha.nahodne(REZIM_DNE);
  p.innerHTML = `<div class="zadani">${u.t}</div>
    <div class="karta"><div class="obrazek">🕐</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva,
    moznosti: Uloha.zamichej([u.spr, ...u.jine]).map(t => ({ klic: t, popis: t })),
    spravnyKlic: u.spr,
    zpravaOk: '✅ ' + u.proc,
    zpravaChyba: 'Zkus jinou možnost.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

/* ---- Pravda, nebo mýtus -------------------------------------------------------------- */
function mytus() {
  const p = $('plocha');
  const u = Uloha.nahodne(MYTY);
  p.innerHTML = `<div class="zadani">Je toto tvrzení pravdivé?</div>
    <div class="karta"><div class="obrazek">💭</div><div class="rezim-den">${u.t}</div></div>`;
  const odezva = document.createElement('div');
  odezva.className = 'odezva';
  Uloha.vyber({
    kam: p, odezva, trida: 'dve',
    moznosti: [
      { klic: 'ano', ikona: '✅', popis: 'Pravda' },
      { klic: 'ne', ikona: '❌', popis: 'Mýtus' },
    ],
    spravnyKlic: u.pravda ? 'ano' : 'ne',
    zpravaOk: '✅ ' + u.proc,
    zpravaChyba: 'Zkus druhou možnost a přečti si vysvětlení.',
    poSpravne: skore.vyhodnot,
    dalsi: novaUloha,
  });
  p.appendChild(odezva);
}

const REZIMY = { pyramida, volba, rezimDne, mytus };
function novaUloha() { REZIMY[rezim](); }

document.querySelectorAll('#rezimy button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#rezimy button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  rezim = b.dataset.rezim;
  novaUloha();
}));
$('btnDalsi').addEventListener('click', novaUloha);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); novaUloha(); }
});
novaUloha();
</script>
</body>
</html>
